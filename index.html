<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAT 213 Midterm Lab</title>
<meta name="description" content="Practice limits, continuity, average rates, and derivatives for the MAT 213 midterm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>:root {
  --paper: #edf1ee;
  --sheet: #fafbf9;
  --ink: #16222a;
  --graphite: #56646b;
  --faint: #8a979c;
  --grid: #d6dfdb;
  --grid-strong: #b8c6c0;
  --curve: #c23b2a;
  --curve-soft: #f6e1dc;
  --ok: #2b7a4b;
  --ok-soft: #dcefe3;
  --bad: #b3261e;
  --bad-soft: #f9e0dc;
  --focus: #1f5fbf;
  --hl-left: #2f6fd6;
  --hl-right: #d9860b;
  --shadow: 0 1px 0 rgba(22, 34, 42, 0.06), 0 8px 24px -12px rgba(22, 34, 42, 0.18);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "STIX Two Text", "Cambria", "Georgia", serif;
  --f-mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1513; --sheet: #151e1b; --ink: #e2eae6; --graphite: #9aa9a3; --faint: #6f7f78;
    --grid: #22302b; --grid-strong: #34463f; --curve: #f07a63; --curve-soft: #3a221d;
    --ok: #6cc793; --ok-soft: #17301f; --bad: #ff8b7b; --bad-soft: #3a1d19; --focus: #7fb0ff; --hl-left: #6fa3ff; --hl-right: #f2b24a;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  --paper: #0e1513; --sheet: #151e1b; --ink: #e2eae6; --graphite: #9aa9a3; --faint: #6f7f78;
  --grid: #22302b; --grid-strong: #34463f; --curve: #f07a63; --curve-soft: #3a221d;
  --ok: #6cc793; --ok-soft: #17301f; --bad: #ff8b7b; --bad-soft: #3a1d19; --focus: #7fb0ff; --hl-left: #6fa3ff; --hl-right: #f2b24a;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font: 17px/1.55 var(--f-body);
  padding-inline: 16px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--paper); padding: 0 0.3em; border-radius: 3px; }

/* ---------- masthead ---------- */
.mast { max-width: 1240px; margin: 0 auto; padding-block: 22px 14px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.brand { display: grid; gap: 2px; }
.brand h1 { margin: 0; font: 800 clamp(30px, 4.4vw, 44px)/0.95 var(--f-display); letter-spacing: -0.02em; font-variation-settings: "opsz" 96; text-wrap: balance; }
.brand h1 .lim { color: var(--curve); font-weight: 700; }
.brand .sub { font: 500 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); }
.countdown { display: flex; align-items: center; gap: 12px; background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow); }
.countdown .num { font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--curve); }
.countdown .lbl { font: 500 11px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--graphite); }
.countdown .lbl b { display: block; color: var(--ink); font-weight: 600; letter-spacing: 0.02em; text-transform: none; font-size: 13px; }

.modes { max-width: 1240px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.modes button { border: 1px solid var(--grid-strong); background: var(--sheet); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: 500 13px/1.2 var(--f-mono); letter-spacing: 0.02em; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.modes button:hover:not([aria-pressed="true"]) { border-color: var(--ink); }

/* ---------- layout ---------- */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 22px; align-items: start; padding-block-end: 60px; }
.rail { position: sticky; top: 12px; background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 12px; padding: 14px 10px; max-height: calc(100vh - 24px); overflow: auto; }
.rail h2 { margin: 12px 8px 4px; font: 600 11px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--graphite); display: flex; justify-content: space-between; gap: 8px; }
.rail h2:first-child { margin-top: 0; }
.rail h2 span:last-child { color: var(--faint); letter-spacing: 0.02em; text-transform: none; }
.rail ul { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 1px; }
.rail button { width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font: 500 14px/1.25 var(--f-display); }
.rail button:hover { background: var(--paper); }
.rail button[aria-current="true"] { background: var(--ink); color: var(--sheet); }
.rail button[aria-current="true"] .pips i { border-color: var(--sheet); }
.rail button[aria-current="true"] .pips i.on { background: var(--sheet); }
.pips { display: flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--grid-strong); display: block; }
.pips i.on { background: var(--ok); border-color: var(--ok); }
.rail .legend { margin: 10px 8px 0; font: 400 11px/1.4 var(--f-mono); color: var(--faint); }

.main { display: grid; gap: 18px; min-width: 0; }

/* ---------- problem sheet ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 22px clamp(16px, 3vw, 32px) 24px; min-width: 0; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; border-bottom: 1px dashed var(--grid-strong); padding-bottom: 10px; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font: 700 22px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.tag { font: 600 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--curve); }
.qnum { font: 800 15px/1 var(--f-display); color: var(--graphite); margin-right: 8px; }
.prompt p { margin: 0 0 10px; max-width: 68ch; }
.prompt mjx-container[display="true"] { margin: 10px 0 !important; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.figure { margin: 6px 0 14px; }
svg.graph { width: 100%; max-width: 560px; height: auto; display: block; background: var(--sheet); border: 1px solid var(--grid); border-radius: 8px; }
.gp-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.gp-axis { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.gp-curve { stroke: var(--curve); stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.gp-open { fill: var(--sheet); stroke: var(--curve); stroke-width: 2.6; }
.gp-closed { fill: var(--curve); stroke: var(--curve); stroke-width: 1; }
.gp-asym { stroke: var(--graphite); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.gp-guide { stroke: var(--graphite); stroke-width: 1.1; stroke-dasharray: 2 4; fill: none; opacity: 0.6; }
.no-guides .gp-guide { display: none; }
.gp-hl { stroke-width: 8; fill: none; stroke-linecap: round; opacity: 0.5; }
.gp-hl-left { stroke: var(--hl-left); }
.gp-hl-right { stroke: var(--hl-right); }
.legend-chip { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
.chip-left { background: var(--hl-left); }
.chip-right { background: var(--hl-right); }
.gp-cross { stroke: var(--ink); stroke-width: 2; fill: none; }
.gp-lab { fill: var(--graphite); font: 500 13px var(--f-mono); }
.gp-name { fill: var(--ink); font: italic 14px var(--f-body); }

.tbl-wrap { overflow-x: auto; margin: 6px 0 14px; }
table.vt { border-collapse: collapse; font: 500 13px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
table.vt th, table.vt td { border: 1px solid var(--grid-strong); padding: 7px 9px; text-align: center; white-space: nowrap; }
table.vt th { background: var(--paper); font-weight: 600; }
table.vt td.qmark { color: var(--curve); font-weight: 700; }

/* ---------- parts ---------- */
.parts { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.part { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 10px 12px 12px 8px; border-radius: 9px; border: 1px solid transparent; }
.part.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.part.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.part .letter { font: 600 14px/2.1 var(--f-mono); color: var(--graphite); text-align: right; }
.part .body { min-width: 0; display: grid; gap: 7px; }
.part .label { line-height: 1.5; overflow-x: auto; overflow-y: hidden; }
.answer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-row input[type="text"] { flex: 1 1 220px; min-width: 0; max-width: 420px; font: 500 16px/1.3 var(--f-mono); background: var(--sheet); border: 1px solid var(--grid-strong); border-bottom: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; padding: 8px 10px; }
.answer-row input[type="text"]:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.mark { font: 700 13px/1 var(--f-mono); letter-spacing: 0.04em; padding: 5px 8px; border-radius: 999px; }
.mark.ok { color: var(--ok); border: 1.5px solid var(--ok); }
.mark.bad { color: var(--bad); border: 1.5px solid var(--bad); }
.preview { font-size: 15px; color: var(--graphite); min-height: 1.4em; overflow-x: auto; }
.preview .pv-lbl { font: 500 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.preview.err { color: var(--bad); font: 500 13px/1.4 var(--f-mono); }
.feedback { font-size: 15px; }
.feedback .reveal { font: 500 13px/1.4 var(--f-mono); color: var(--graphite); }
.choices { display: grid; gap: 6px; }
.choice { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--grid-strong); border-radius: 8px; cursor: pointer; background: var(--sheet); line-height: 1.45; }
.choice:hover { border-color: var(--ink); }
.choice input { margin: 4px 0 0; accent-color: var(--ink); }
.choice.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.choice.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-row .choice { grid-template-columns: 18px auto; }

.keys { display: flex; flex-wrap: wrap; gap: 4px; }
.keys button { font: 500 12px/1 var(--f-mono); border: 1px solid var(--grid-strong); background: var(--paper); border-radius: 5px; padding: 6px 8px; cursor: pointer; min-width: 32px; }
.keys button:hover { border-color: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--sheet); padding: 9px 16px; border-radius: 8px; cursor: pointer; font: 600 14px/1.1 var(--f-display); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { border-color: var(--grid-strong); }
.score-line { font: 500 13px var(--f-mono); color: var(--graphite); margin-left: auto; }

.hint { margin-top: 14px; font-size: 15px; background: var(--paper); border-radius: 8px; padding: 10px 14px; }
.hint b { font: 600 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); margin-right: 6px; }
.solution { margin-top: 16px; border-top: 2px solid var(--ink); padding-top: 12px; }
.solution > .sol-lbl { font: 600 11px var(--f-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--curve); }
.solution h4 { margin: 12px 0 4px; font: 700 15px var(--f-display); }
.solution p { margin: 6px 0; max-width: 72ch; }
.solution mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }

/* ---------- dashboard / notes ---------- */
.intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.intro .cell h4 { margin: 0 0 4px; font: 700 16px var(--f-display); }
.intro .cell p { margin: 0; font-size: 15px; color: var(--graphite); }
.warn { font-size: 15px; background: var(--curve-soft); border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
.warn b { font-family: var(--f-display); }

.formula { display: grid; gap: 18px; }
.formula section h3 { margin: 0 0 8px; font: 700 20px var(--f-display); display: flex; gap: 10px; align-items: baseline; }
.formula section h3 .tag { font-size: 12px; }
.formula dl { margin: 0; display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 8px 18px; }
.formula dt { font: 600 12px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--graphite); }
.formula dd { margin: 0; overflow-x: auto; }

.exam-bar { position: sticky; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow); }
.exam-bar .clock { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.exam-bar .meta { font: 500 12px/1.3 var(--f-mono); letter-spacing: 0.05em; opacity: 0.85; }
.exam-bar .btn { background: var(--sheet); color: var(--ink); border-color: var(--sheet); margin-left: auto; }
.result { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
.result .big { font: 800 56px/1 var(--f-display); color: var(--curve); font-variant-numeric: tabular-nums; }
.result table { border-collapse: collapse; font: 500 13px var(--f-mono); }
.result td { padding: 3px 12px 3px 0; }

.setup { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; }
.setup label { display: inline-flex; gap: 6px; align-items: center; font: 500 13px var(--f-mono); }
.setup select { background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 6px; padding: 6px 8px; }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; display: grid; gap: 2px; padding: 10px; }
  .rail ul { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .rail li { flex: 0 0 auto; }
  .rail button { border: 1px solid var(--grid-strong); white-space: nowrap; }
  .formula dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .formula dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { .btn:hover { transform: none; } }

/* ---------- mock exams ---------- */
.mock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.mock-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-content: start; }
.mock-card .actions { grid-column: 1 / -1; margin-top: 10px; }
.mock-letter { font: 800 64px/0.9 var(--f-display); color: var(--curve); min-width: 44px; }
.mock-card h3 { margin: 4px 0 2px; font: 700 20px/1.2 var(--f-display); }
.mock-meta, .mock-best { margin: 0; font: 500 13px/1.5 var(--f-mono); color: var(--graphite); }
.mock-best b { color: var(--ok); }

/* ---------- printable paper ---------- */
.paper-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.paper-tools .score-line { margin-left: 0; }
.paper { background: var(--sheet); color: var(--ink); border: 1px solid var(--grid-strong); border-radius: 4px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 56px); max-width: 900px; font-size: 16px; }
.paper-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; font-size: 15px; }
.paper-title { font: 600 24px/1.25 var(--f-body); }
.paper-name { display: grid; gap: 10px; min-width: 240px; }
.paper-total { font: 600 17px var(--f-body); align-self: end; }
.line { display: inline-block; width: 190px; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
.line.short { width: 60px; }
.paper-dir { margin: 14px 0 4px; font-size: 15px; max-width: none; }
.paper-q { padding-block: 18px 8px; border-bottom: 1px solid var(--grid); break-inside: avoid; }
.pq-head { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.pq-num { font-weight: 600; }
.pq-total { font: 500 12px var(--f-mono); color: var(--graphite); white-space: nowrap; padding-top: 3px; }
.pq-body p { margin: 0 0 8px; }
.pq-body mjx-container[display="true"] { margin: 8px 0 !important; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.pq-parts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.pq-parts li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
.pq-letter { color: var(--graphite); }
.pq-pts { font: 500 11px var(--f-mono); color: var(--faint); }
.pq-choices { display: grid; gap: 4px; margin-top: 4px; }
.blank { display: inline-block; width: min(180px, 40%); border-bottom: 1px solid var(--ink); margin-left: 8px; }
.tf { font-weight: 600; margin-right: 14px; }
.key-ans { margin-top: 3px; color: var(--ok); font-weight: 600; }
.work { margin-top: 10px; border: 1px dashed var(--grid-strong); border-radius: 4px; }
.work.short { height: 0.5in; }
.work.mid { height: 1.5in; }
.work.tall { height: 2.5in; }
.paper .figure svg.graph { max-width: 340px; }
.bare .mast, .bare .modes, .bare .rail { display: none; }
.bare .shell { display: block; max-width: 900px; }
@page { margin: 0.55in; }
@media print {
  :root:root, :root:root[data-theme] {
    --paper: #ffffff; --sheet: #ffffff; --ink: #000000; --graphite: #333333; --faint: #666666;
    --grid: #dddddd; --grid-strong: #999999; --curve: #b0281a; --ok: #1d6b3d; --shadow: none;
  }
  body { background: #fff !important; padding: 0; font-size: 12pt; }
  .mast, .modes, .rail, .paper-tools, .exam-bar { display: none !important; }
  .shell { display: block; max-width: none; padding: 0; }
  .paper { border: 0; box-shadow: none; padding: 0; max-width: none; }
  .paper-q { page-break-inside: avoid; }
}

/* ---------- Pearson-format questions ---------- */
.pq-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 8px 16px; border-bottom: 1px solid var(--grid-strong); padding-bottom: 12px; margin-bottom: 14px; }
.pq-code { font: 700 20px/1.2 var(--f-display); }
.pq-meta { font: 500 12px/1.7 var(--f-mono); color: var(--graphite); }
.pq-sep { margin: 0 8px; color: var(--grid-strong); }
.pq-prompt { border: 1px solid var(--grid-strong); border-radius: 8px; padding: 14px 16px; }
.pq-prompt p { margin: 0 0 10px; max-width: 72ch; }
.pq-prompt mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.pq-part { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); display: grid; gap: 8px; min-width: 0; }
.pq-part-head { font: 700 15px var(--f-display); }
.pq-q { line-height: 1.5; overflow-x: auto; overflow-y: hidden; }
.pq-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 5px 2px; cursor: pointer; line-height: 1.5; }
.pq-opt > label { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; cursor: pointer; }
.pq-opt input[type="radio"], .pq-opt input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); flex: none; }
.pq-letter { font-weight: 600; }
.pq-multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 2px 20px; }
.pq-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; line-height: 1.5; }
.pq-box { font: 500 16px/1.3 var(--f-mono); width: 12em; max-width: 100%; background: var(--sheet); border: 1.5px solid var(--grid-strong); border-radius: 4px; padding: 6px 8px; }
.pq-box:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.pq-instr { font-size: 14px; color: var(--focus); }

<script>// ================= core: random, rationals, TeX helpers, parser, answer checking =================

function divByPower(coefs, m) {
  const n = coefs.length - 1; let out = "";
  coefs.forEach((c, i) => {
    const k = n - i; if (c === 0) return;
    const neg = c < 0, a = Math.abs(c); let body;
    if (k > m) body = (a === 1 ? "" : a) + (k - m === 1 ? "x" : `x^{${k - m}}`);
    else if (k === m) body = String(a);
    else body = `\\frac{${a}}{${m - k === 1 ? "x" : `x^{${m - k}}`}}`;
    out += out === "" ? (neg ? "-" : "") + body : (neg ? " - " : " + ") + body;
  });
  return out;
}

const CONT_CHOICES = [

GEN.continuity = () => {
  const v = R.pick(["A", "A", "B", "D"]);
  if (v === "A") {
    const c = R.int(-2, 3), co = [R.pick([1, -1, -1, 2, -2]), R.int(-4, 4), R.int(-6, 8)], low = R.chance(0.5);
    const left = evalPoly(co, c), m = R.nz(-4, 4), equal = R.chance(0.5);
    const k = equal ? left.sub(m * c) : left.sub(m * c).add(R.pick([-3, -2, 2, 3]));
    const right = q(m * c).add(k);
    const Lt = T.poly(co, "x", low), Rt = T.poly([m, k]);
    const cont = left.eq(right);
    const choices = CONT_CHOICES.map((s) => s.replace("f(a)", `f(${c})`));
    const subst = co.map((cf, i) => ({ cf, deg: 2 - i })).filter((o) => o.cf !== 0);
    const substTex = (low ? subst.reverse() : subst).map((o, i) => {
      const neg = o.cf < 0, a = Math.abs(o.cf), body = o.deg === 0 ? `${a}` : `${a === 1 ? "" : a}${T.par(c)}${o.deg === 2 ? "^2" : ""}`;
      return (i === 0 ? (neg ? "-" : "") : neg ? " - " : " + ") + body;
    }).join("");
    return {
      prompt: para(`Let`) + $M(`f(x) = \\begin{cases} ${Lt} & x \\le ${c} \\\\ ${Rt} & x > ${c} \\end{cases}`) + para(`Determine whether ${$m("f(x)")} is continuous at ${$m(`x = ${c}`)}.`),
      parts: [
        P.num($m(`f(${c})`), left),
        P.num($m(`${T.lim(c + "^-")} f(x)`), left),
        P.num($m(`${T.lim(c + "^+")} f(x)`), right),
        P.num($m(`${T.lim(c)} f(x)`), limVal(left, right)),
        P.mcFixed(`Is ${$m("f")} continuous at ${$m(`x = ${c}`)}?`, choices, cont ? 0 : 1),
      ],
      hint: `Watch the signs: with x = ${c}, a term like -x² is -(${c})² = ${-(c * c)}. Substitute into each term separately.`,
      solution:
        para(`<b>1. ${$m(`f(${c})`)}:</b> ${c} satisfies ${$m(`x \\le ${c}`)}, so use the top piece: ${$m(`${substTex} = ${left.tex()}`)}.`) +
        para(`<b>2. Limit:</b> left uses the top piece → ${$m(left.tex())}; right uses ${$m(Rt)} → ${$m(`${m}${T.par(c)} ${k.n < 0 ? "-" : "+"} ${k.abs().tex()} = ${right.tex()}`)}.`) +
        para(cont ? `<b>3.</b> Both one-sided limits are ${$m(left.tex())}, so the limit exists and equals ${$m(`f(${c})`)}. <b>Continuous.</b>` : `<b>3.</b> ${$m(left.tex())} ≠ ${$m(right.tex())}, so ${$m(`${T.lim(c)} f(x)`)} DNE. <b>Not continuous</b> — a jump discontinuity.`),
    };
  }
  if (v === "B") {
    const r = R.nz(-4, 4); let s; do { s = R.int(-5, 5); } while (s === r);
    const L = r - s, equal = R.chance(0.45), k = equal ? L : L + R.pick([-3, -2, -1, 1, 2, 3]);
    const choices = CONT_CHOICES.map((x) => x.replace("f(a)", `f(${r})`));
    return {
      prompt: para(`Is ${$m("f(x)")} continuous at ${$m(`x = ${r}`)}?`) + $M(`f(x) = \\begin{cases} \\dfrac{${T.poly([1, -(r + s), r * s])}}{${T.fac(r).slice(1, -1)}} & x \\ne ${r} \\\\ ${k} & x = ${r} \\end{cases}`),
      parts: [
        P.num($m(`f(${r})`), q(k)),
        P.num($m(`${T.lim(r)} f(x)`), q(L)),
        P.mcFixed(`Is ${$m("f")} continuous at ${$m(`x = ${r}`)}?`, choices, equal ? 0 : 2),
      ],
      hint: "The bottom piece tells you f(a) directly. For the limit, factor the top piece and cancel.",
      solution:
        para(`<b>1.</b> ${$m(`f(${r}) = ${k}`)} (given directly by the second piece).`) +
        para(`<b>2.</b> ${$m(`${T.lim(r)} \\frac{${T.fac(r)}${T.fac(s)}}{${T.fac(r)}} = ${T.lim(r)} ${s === 0 ? "x" : T.fac(s)} = ${L}`)}.`) +
        para(equal ? `<b>3.</b> ${L} = ${k}. All three conditions hold → <b>continuous</b>.` : `<b>3.</b> The limit is ${L} but ${$m(`f(${r}) = ${k}`)}. They're not equal → <b>not continuous</b> (a removable discontinuity).`),
    };
  }

  const c = R.pick([1, 2, 3, -1, -2]), a = R.int(-4, 4), b = R.int(-6, 6);

    prompt: para(`Find the value of ${$m("k")} that makes ${$m("f")} continuous at ${$m(`x = ${c}`)}.`) + $M(`f(x) = \\begin{cases} ${T.poly([1, a, 0])} & x < ${c} \\\\ kx ${b < 0 ? "-" : "+"} ${Math.abs(b)} & x \\ge ${c} \\end{cases}`),
    parts: [
      P.num($m(`${T.lim(c + "^-")} f(x)`), q(leftV)),
      P.num($m("k ="), k),
    ],
    hint: "Continuity needs left limit = right limit = f(c). Set the two pieces equal at x = c and solve for k.",
    solution:
      para(`Left: ${$m(`${T.par(c)}^2 ${a < 0 ? "-" : "+"} ${Math.abs(a)}${T.par(c)} = ${leftV}`)}. Right (and ${$m(`f(${c})`)}): ${$m(`k${T.par(c)} ${b < 0 ? "-" : "+"} ${Math.abs(b)}`)}.`) +
      $M(`${c}k ${b < 0 ? "-" : "+"} ${Math.abs(b)} = ${leftV} \\;\\Rightarrow\\; k = \\frac{${leftV - b}}{${c}} = ${k.tex()}`),
  };
};

    () => { const c = R.nz(-3, 3); let d; do { d = R.nz(-4, 4); } while (d === c); return { t: `f(x) = \\frac{${T.fac(c).slice(1, -1)}}{${T.poly([1, -(c + d), c * d])}} \\text{ at } x = ${d}`, a: 3, s: `Factor: ${$m(`\\frac{${T.fac(c)}}{${T.fac(c)}${T.fac(d)}}`)}. The ${$m(T.fac(d))} factor does NOT cancel, so ${$m(`x = ${d}`)} is a vertical asymptote → infinite.` }; },

const sumTex = (items) => {
  let out = "";
  items.forEach(([c, body]) => {
    c = Q.of(c); if (c.isZero()) return;
    const neg = c.n < 0, a = neg ? c.neg() : c;
    const s = (body && a.eq(1) ? "" : a.tex()) + body;
    out += out === "" ? (neg ? "-" : "") + s : (neg ? " - " : " + ") + s;
  });
  return out || "0";
};

// ================= Section 1.4 — The limit definition of the derivative =================
const LH = `\\lim_{h \\to 0}`;
const noH = [{ v: "h", msg: "Your answer still contains h — take the limit as h → 0 (let h become 0 after cancelling)." }];

function derivSteps(kind, d) {
  if (kind === "quad") {
    const { a, b, c } = d;
    return $M(`f'(x) = ${LH} \\frac{f(x + h) - f(x)}{h} = ${LH} \\frac{\\left[${sumTex([[a, "(x + h)^2"], [b, "(x + h)"], [c, ""]])}\\right] - \\left(${T.poly([a, b, c])}\\right)}{h}`) +
      $M(`= ${LH} \\frac{${sumTex([[a, "x^2"], [2 * a, "xh"], [a, "h^2"], [b, "x"], [b, "h"], [c, ""]])} ${sumTex([[-a, "x^2"], [-b, "x"], [-c, ""]]).replace(/^(?!-)/, "+ ").replace(/^-/, "- ")}}{h}`) +
      $M(`= ${LH} \\frac{${sumTex([[2 * a, "xh"], [a, "h^2"], [b, "h"]])}}{h} = ${LH} \\frac{h\\left(${sumTex([[2 * a, "x"], [a, "h"], [b, ""]])}\\right)}{h}`) +
      $M(`= ${LH} \\left(${sumTex([[2 * a, "x"], [a, "h"], [b, ""]])}\\right) = ${sumTex([[2 * a, "x"], [b, ""]])}`);
  }
  if (kind === "recip") {
    const { k } = d;
    return $M(`f'(x) = ${LH} \\frac{\\frac{${k}}{x + h} - \\frac{${k}}{x}}{h} = ${LH} \\frac{\\frac{${k}x - ${k}(x + h)}{x(x + h)}}{h}`) +
      $M(`= ${LH} \\frac{${-k}h}{x(x + h)} \\cdot \\frac{1}{h} = ${LH} \\frac{${-k}}{x(x + h)} = \\frac{${-k}}{x^2}`);
  }
  if (kind === "sqrt") {
    return $M(`f'(x) = ${LH} \\frac{\\sqrt{x + h} - \\sqrt{x}}{h} \\cdot \\frac{\\sqrt{x + h} + \\sqrt{x}}{\\sqrt{x + h} + \\sqrt{x}} = ${LH} \\frac{(x + h) - x}{h\\left(\\sqrt{x + h} + \\sqrt{x}\\right)}`) +
      $M(`= ${LH} \\frac{1}{\\sqrt{x + h} + \\sqrt{x}} = \\frac{1}{2\\sqrt{x}}`);
  }
  const { b } = d;
  const bx = b ? ` ${b < 0 ? "-" : "+"} ${Math.abs(b)}` : "";
  return $M(`f'(x) = ${LH} \\frac{\\left[(x + h)^3${b ? `${bx}(x + h)` : ""}\\right] - \\left(${T.poly([1, 0, b, 0])}\\right)}{h}`) +
    $M(`= ${LH} \\frac{3x^2h + 3xh^2 + h^3${b ? `${bx}h` : ""}}{h} = ${LH} \\left(3x^2 + 3xh + h^2${bx}\\right) = ${T.poly([3, 0, b])}`);
}

function randFn(kinds) {
  const kind = R.pick(kinds);
  if (kind === "quad") { const a = R.pick([1, -1, 2, -2, 3]), b = R.int(-6, 6), c = R.int(-6, 6); return { kind, d: { a, b, c }, tex: T.poly([a, b, c]), f: (x) => evalPoly([a, b, c], x), fp: (x) => q(2 * a).mul(x).add(b), fpFn: (e) => 2 * a * e.x + b, fpTex: T.poly([2 * a, b]), extra: {} }; }
  if (kind === "recip") { const k = R.pick([1, 2, 3, 4, 6, -2, -4]); return { kind, d: { k }, tex: `\\frac{${k}}{x}`, f: (x) => q(k).div(x), fp: (x) => q(-k).div(Q.of(x).mul(x)), fpFn: (e) => -k / (e.x * e.x), fpTex: `\\frac{${-k}}{x^2}`, extra: { avoid: (e) => Math.abs(e.x) < 0.3 } }; }
  if (kind === "sqrt") return { kind, d: {}, tex: `\\sqrt{x}`, f: null, fp: null, fpFn: (e) => 1 / (2 * Math.sqrt(e.x)), fpTex: `\\frac{1}{2\\sqrt{x}}`, extra: { positive: true } };
  const b = R.int(-5, 5); return { kind: "cubic", d: { b }, tex: T.poly([1, 0, b, 0]), f: (x) => evalPoly([1, 0, b, 0], x), fp: (x) => q(3).mul(Q.of(x).mul(x)).add(b), fpFn: (e) => 3 * e.x * e.x + b, fpTex: T.poly([3, 0, b]), extra: {} };
}

    parts: [

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function withSeed(seed, fn) {
  const orig = Math.random; Math.random = mulberry32(seed);
  try { return fn(); } finally { Math.random = orig; }
}

// ================= Pearson-format questions (part 1): strict checks, converters, limits & continuity =================
var PGEN = window.PGEN || {}; window.PGEN = PGEN;

const INSTR = {
  frac: "(Type an integer or a simplified fraction.)",
  round4: "(Round to four decimal places as needed.)",
  round2: "(Round to two decimal places as needed.)",
  list: "(Use a comma to separate answers as needed.)",
  expr: (vars) => `(Type an expression using ${vars.join(" and ")} as the variable${vars.length > 1 ? "s" : ""}.)`,
};
const LIM_DNE = "The limit does not exist and is neither ∞ nor −∞.";

const UNIT_SYN = {
  degree: ["degree", "degrees", "deg", "degs", "°", "°f", "degreesf", "degreef", "degreesfahrenheit"],
  hour: ["hour", "hours", "hr", "hrs", "h"], minute: ["minute", "minutes", "min", "mins"], second: ["second", "seconds", "sec", "secs", "s"],
  mile: ["mile", "miles", "mi"], foot: ["foot", "feet", "ft"], inch: ["inch", "inches", "in"], centimeter: ["centimeter", "centimeters", "cm"],
  pound: ["pound", "pounds", "lb", "lbs"], dollar: ["dollar", "dollars", "$", "usd"], gallon: ["gallon", "gallons", "gal"],
  day: ["day", "days"], week: ["week", "weeks", "wk", "wks"], month: ["month", "months", "mo", "mos"], year: ["year", "years", "yr", "yrs"],
  item: ["item", "items", "unit", "units"], person: ["person", "people", "persons"],
};
function normUnits(s) {
  s = s.toLowerCase().trim();
  if (/^mph$/.test(s)) return "mile/hour";
  s = s.replace(/\s+per\s+/g, "/").replace(/\s*\/\s*/g, "/").replace(/\s+/g, "");
  const bits = s.split("/");
  if (bits.length !== 2) return null;
  return bits.map((b) => Object.keys(UNIT_SYN).find((k) => UNIT_SYN[k].includes(b)) || "?").join("/");
}

// DOM-free strict checks, modeled on how the online homework grades
const PCheck = {
  num(raw, part) {
    const exact = part.approx == null;
    const r = Check.num(raw, { ans: part.ans, approx: exact ? 1e-9 : part.approx });
    if (r.empty || r.err) return r;
    if (!r.ok && exact && part.ans instanceof Q && /\d*\.\d/.test(raw)) {
      const v = Number(raw.replace(/\s/g, ""));
      if (isFinite(v) && Math.abs(v - part.ans.val()) < 0.006) return { ok: false, err: "Close, but this box wants the exact value. Type a simplified fraction, not a rounded decimal." };
    }
    if (r.ok) {
      const m = raw.replace(/\s+/g, "").match(/^\(?(-?\d+)\)?\/\(?(-?\d+)\)?$/);
      if (m && gcd(+m[1], +m[2]) > 1) return { ok: false, err: "Equivalent, but not simplified. Unreduced fractions get marked wrong — reduce it." };
    }
    return { ok: r.ok, note: r.note };
  },
  list(raw, part) {
    if (!raw.trim()) return { empty: true };
    const vals = [];
    for (const piece of raw.split(/[,;]/)) {
      if (!piece.trim()) continue;
      try { vals.push(Parser.ev(Parser.parse(rhs(piece)), {})); } catch (e) { return { err: `Couldn't read "${piece.trim()}".` }; }
    }
    const want = part.ans.map((a) => Q.of(a).val());
    if (vals.length !== want.length) return { ok: false };
    const used = new Set();
    for (const v of vals) { const k = want.findIndex((w, i) => !used.has(i) && closeTo(v, w)); if (k < 0) return { ok: false }; used.add(k); }
    return { ok: true };
  },
  cf(st, part) {
    const none = part.ans === "DNE" || part.ans === "NONE";
    if (!st.choice) return st.text && st.text.trim() ? { err: "Select choice A or B first." } : { empty: true };
    if (st.choice === "B") return { ok: none };
    if (none) return { ok: false };
    return part.list ? PCheck.list(st.text, part) : PCheck.num(st.text, part);
  },
  multi(sel, part) { if (!sel.length) return { empty: true }; return { ok: [...part.ans].sort().join() === [...sel].sort().join() }; },
  units(raw, part) {
    if (!raw.trim()) return { empty: true };
    const n = normUnits(raw);
    if (n === part.canon) return { ok: true };
    const [o, i] = part.canon.split("/");
    if (n === `${i}/${o}`) return { ok: false, err: "Those units are flipped. A rate is (output units) per (input unit)." };
    if (n === null && normUnits(raw + "/x") !== null) return { ok: false, err: "A rate needs two units: something per something." };
    return { ok: false };
  },
  mc: (k, part) => (k < 0 ? { empty: true } : { ok: k === part.ans }),
  expr(raw, part) {
    const s = raw.replace(/\s+/g, "");
    if (part.expanded && s && /\([^()]*[xh][^()]*\)/.test(s)) return { ok: false, err: "Expand completely. The answer shouldn't have parentheses around x or h." };
    if (part.factored && s && !/\)\*?\(|[0-9a-z]\(|\)\^/i.test(s)) return { ok: false, err: "That's equivalent, but write it in factored form, like (x - 2)(x + 5)." };
    return Check.expr(raw, part);
  },
  line(raw, part) {
    if (part.slopeIntercept && /\([^()]*x[^()]*\)/.test(raw.replace(/\s+/g, ""))) return { ok: false, err: "Write it in slope-intercept form, y = mx + b, with no parentheses around x." };
    return Check.line(raw, part);
  },
};

function pAnswerText(part) {
  switch (part.type) {
    case "cf": return part.ans === "DNE" || part.ans === "NONE" ? `B. ${part.dneText}` : `A. ${part.prefix} ${part.list ? "x = " : "= "}${part.list ? part.ans.map((a) => $m(Q.of(a).tex())).join(", ") : $m(T.ans(part.ans))}`;
    case "num": return $m(T.ans(part.ans));
    case "units": return part.display;
    case "multi": return part.ans.length ? part.ans.map((i) => part.choices[i]).join(", ") : "none";
    case "mc": return part.choices[part.ans];
    default: return $m(part.display);
  }
}

const PP = {
  cf: (prefix, ans, dneText = LIM_DNE, extra = {}) => ({ type: "cf", prefix, ans, dneText, instr: extra.approx ? INSTR.round4 : INSTR.frac, ...extra }),
  num: (label, ans, extra = {}) => ({ type: "num", label, ans, instr: extra.approx ? INSTR.round4 : INSTR.frac, ...extra }),
  yn: (label, yes) => ({ type: "mc", label, choices: ["Yes", "No"], ans: yes ? 0 : 1 }),
  multi: (label, choices, ans) => ({ type: "multi", label, choices, ans }),
  units: (label, canon, display, example) => ({ type: "units", label, canon, display, instr: `(Type the units, for example ${example}.)` }),
  expr: (label, fn, display, vars = ["x"], extra = {}) => ({ type: "expr", label, fn, display, vars, instr: INSTR.expr(vars), forbid: noH, ...extra }),
  line: (label, m, b) => ({ type: "line", label, m, b, display: T.line(Q.of(m), Q.of(b)), prefix: "y =", instr: INSTR.expr(["x"]) }),
  list: (ans, noneText) => ({ type: "cf", list: true, prefix: "", ans, dneText: noneText, instr: INSTR.list }),
};

// Convert a practice-mode problem into the online-homework format
function pearsonize(pr, opts = {}) {
  const parts = pr.parts.map((p) => {
    if (p.type === "num") {
      const lab = p.label.trim();
      const isLim = lab.includes("\\lim");
      const isVal = /^\\\(\s*[A-Za-z]\s*(\\left)?\(/.test(lab);
      const extra = p.approx ? { approx: p.approx, instr: INSTR.round4 } : opts.round ? { approx: 0.0051, instr: INSTR.round2 } : {};
      if (isLim || isVal) {
        const prefix = lab.replace(/\s*=\s*\\\)$/, "\\)");
        return { ...PP.cf(prefix, p.ans, isLim ? LIM_DNE : `${prefix} is undefined.`), ...extra };
      }
      return { ...PP.num(lab, p.ans), ...extra };
    }
    if (p.type === "expr") return { ...p, instr: INSTR.expr(p.vars || ["x"]) };
    if (p.type === "line") return { ...p, prefix: "y =", instr: INSTR.expr(["x"]) };
    return p;
  });
  const prompt = pr.prompt.replace(/[^.>]*(<b>DNE<\/b>|<code>-?inf<\/code>)[^.]*\./g, "").replace(/<p>\s*<\/p>/g, "");
  return { ...pr, prompt, parts };
}

PGEN.limGraph = () => {
  const G = Graph.randomPiecewise(R.pick([["jump", "hole", "asym"], ["hole", "jump"], ["asym", "jump"], ["hole", "asym", "cont"], ["jump", "hole", "cont"]]));
  const n = R.shuffle(G.inner.filter((k) => k.type !== "continuous"))[0];
  const a = n.x;
  return {
    prompt: para(`Use the graph of ${$m("y = f(x)")} to find the limits and the function value at ${$m(`x = ${a}`)}.`),
    figure: G.svg,
    parts: [
      PP.cf($m(`${T.lim(a + "^-")} f(x)`), n.left),
      PP.cf($m(`${T.lim(a + "^+")} f(x)`), n.right),
      PP.cf($m(`${T.lim(a)} f(x)`), n.limit),
      PP.cf($m(`f(${a})`), n.value, `${$m(`f(${a})`)} is undefined.`),
    ],
    hint: "Heights the curve approaches give the limits (open dots count). The filled dot gives f(a). If a side shoots up, type ∞ in box A.",
    solution: annotatedGraph(G, a) + describeNode(n) + para(`On this format, an infinite limit goes in box A as ${$m("\\infty")} or ${$m("-\\infty")}. Choice B is only for a limit that doesn't settle anywhere, like left → 2 and right → 5.`),

PGEN.limAlg = () => {

    const t = `${T.lim(r)} \\frac{${T.poly([1, k])}}{${T.fac(r)}^2}`, s = Math.sign(r + k);

  } else if (kind === "DIRECT") {
    let a, s; do { a = R.int(-4, 5); s = R.nz(-5, 5); } while (a + s === 0);

const REASONS = (a) => [`None — ${$m("f")} is continuous at ${$m(`x = ${a}`)}`, `${$m(`f(${a})`)} is not defined`, `${$m(`${T.lim(a)} f(x)`)} does not exist`, `${$m(`${T.lim(a)} f(x)`)} exists but does not equal ${$m(`f(${a})`)}`];

    sol = para(`At ${$m(`x = ${r}`)} the denominator is 0, so ${$m(`f(${r})`)} is not defined — condition 1 already fails. (The limit does exist: it's ${r - s}. That makes it a removable discontinuity.)`);

  }

    prompt: $M(ftex) + para(`Determine whether ${$m("f")} is continuous at ${$m(`x = ${a}`)}.`),
    parts: [PP.yn(`Is ${$m("f")} continuous at ${$m(`x = ${a}`)}?`, yes), P.mcFixed(`Which condition for continuity fails first?`, REASONS(a), reason)],

    solution: sol,

PGEN.discList = () => {
  const v = R.pick(["rat2", "rat2", "rat1", "poly", "pwJump", "pwCont", "noReal"]);
  let ftex, ans, sol;
  if (v === "rat2" || v === "rat1") {
    const r1 = R.nz(-5, 5); let r2; do { r2 = R.nz(-5, 5); } while (r2 === r1);
    const top = v === "rat1" ? T.fac(r1).slice(1, -1) : T.poly([1, R.int(-6, 6)]);
    ftex = `f(x) = \\frac{${top}}{${T.poly([1, -(r1 + r2), r1 * r2])}}`; ans = [q(r1), q(r2)].sort((x, y) => x.val() - y.val());
    sol = para(`Rational functions are discontinuous exactly where the denominator is 0: ${$m(`${T.poly([1, -(r1 + r2), r1 * r2])} = ${T.fac(r1)}${T.fac(r2)} = 0`)} → ${$m(`x = ${ans[0].tex()},\\ ${ans[1].tex()}`)}.`) +
      (v === "rat1" ? para(`Even though ${$m(T.fac(r1))} cancels, ${$m(`f(${r1})`)} is still undefined — that one is a removable discontinuity, but it still counts.`) : "");
  } else if (v === "poly") {
    ftex = `f(x) = ${T.poly([R.nz(-3, 3), R.int(-5, 5), R.int(-6, 6)])}`; ans = "NONE"; sol = para("Polynomials have no discontinuities.");
  } else if (v === "noReal") {
    const k = R.int(1, 9); ftex = `f(x) = \\frac{${R.nz(-5, 5)}}{x^2 + ${k}}`; ans = "NONE"; sol = para(`${$m(`x^2 + ${k}`)} is always at least ${k}, so the denominator is never 0 → no discontinuities.`);
  } else {
    const c = R.int(-3, 3), m = R.nz(-3, 3), p = R.int(-4, 4), left = c * c + p, jump = v === "pwJump";
    const b = left - m * c + (jump ? R.pick([-3, -2, 2, 3]) : 0);
    ftex = `f(x) = \\begin{cases} ${T.poly([1, 0, p])} & \\text{for } x < ${c} \\\\ ${T.poly([m, b])} & \\text{for } x \\ge ${c} \\end{cases}`;
    ans = jump ? [q(c)] : "NONE";
    sol = para(`Each piece is a polynomial, so only ${$m(`x = ${c}`)} can be a problem. Left: ${$m(`${T.par(c)}^2 ${p < 0 ? "-" : "+"} ${Math.abs(p)} = ${left}`)}. Right: ${$m(`${m}${T.par(c)} ${b < 0 ? "-" : "+"} ${Math.abs(b)} = ${m * c + b}`)}.`) +
      para(jump ? `They differ → discontinuous at ${$m(`x = ${c}`)}.` : "They match (and f(c) uses the bottom piece, which gives the same value) → no discontinuities.");
  }
  return {
    prompt: $M(ftex) + para(`Find all values of ${$m("x")} where ${$m("f")} is discontinuous.`),
    parts: [PP.list(ans, "There are no discontinuities.")],
    hint: "Rational function: set the denominator equal to 0. Piecewise: compare the pieces at the break point.",
    solution: sol,
  };
};

// ================= Pearson-format questions (part 2): rates of change, derivatives, topic list, tests =================
const FRACS = [q(1, 2), q(1, 3), q(1, 4), q(3, 2), q(-1, 2), q(2, 3), q(3, 4), q(-3, 2)];
const clock = (h) => (h === 12 ? "noon" : `${h % 12 || 12} ${h < 12 ? "a.m." : "p.m."}`);

function quadSteps(a, b, c, low = false) {
  a = Q.of(a); b = Q.of(b); c = Q.of(c);
  return $M(`f'(x) = ${LH} \\frac{\\left[${sumTex([[a, "(x + h)^2"], [b, "(x + h)"], [c, ""]])}\\right] - \\left(${T.poly([a, b, c], "x", low)}\\right)}{h}`) +
    $M(`= ${LH} \\frac{${sumTex([[a.mul(2), "xh"], [a, "h^2"], [b, "h"]])}}{h} = ${LH} \\left(${sumTex([[a.mul(2), "x"], [a, "h"], [b, ""]])}\\right) = ${T.poly([a.mul(2), b])}`);
}

PGEN.arcFunction = () => {
  const v = R.pick(["quad", "quad", "quadFrac", "recip", "sqrt", "cubic"]);
  let ftex, a, b, f;
  if (v === "quad" || v === "quadFrac") {
    const co = [v === "quad" ? q(R.nz(-3, 4)) : R.pick(FRACS), q(R.int(-6, 6)), q(R.int(-9, 9))];
    ftex = T.poly(co); a = R.int(-2, 3); b = a + R.int(1, 4); f = (x) => evalPoly(co, x);
  } else if (v === "recip") {
    const k = R.pick([2, 3, 4, 6, 8, -4, -6]); ftex = `\\frac{${k}}{x}`; a = R.int(1, 3); b = a + R.int(1, 4); f = (x) => q(k, x);
  } else if (v === "sqrt") {
    const r1 = R.int(0, 3), r2 = r1 + R.int(1, 3); ftex = `\\sqrt{x}`; a = r1 * r1; b = r2 * r2; f = (x) => q(Math.round(Math.sqrt(x)));
  } else {
    const c = R.int(-5, 5); ftex = T.poly([1, 0, 0, c]); a = R.int(-2, 1); b = a + R.int(1, 3); f = (x) => q(x ** 3 + c);
  }
  const fa = f(a), fb = f(b), val = fb.sub(fa).div(b - a);
  return {
    prompt: para(`Find the average rate of change for the function over the given interval.`) + $M(`y = ${ftex} \\quad \\text{between } x = ${a} \\text{ and } x = ${b}`),
    parts: [PP.num(`The average rate of change is`, val)],
    hint: "Compute f(b) and f(a) first, then (f(b) − f(a)) / (b − a). Reduce the fraction.",
    solution: $M(`f(${b}) = ${fb.tex()}, \\qquad f(${a}) = ${fa.tex()}`) + $M(`\\frac{f(${b}) - f(${a})}{${b} - ${T.par(a)}} = \\frac{${fb.tex()} - ${T.par(fa)}}{${b - a}} = \\frac{${fb.sub(fa).tex()}}{${b - a}} = ${val.tex()}`),
  };
};

PGEN.tangentP = () => {
  const v = R.pick(["cq", "cq", "std", "recip", "cubic", "sqrt"]);
  let ftex, p, y0, m, steps;
  if (v === "cq" || v === "std") {
    const k = v === "cq" ? R.pick([q(-3), q(-2), q(-1), q(1), q(2), q(3), q(1, 2), q(-1, 2)]) : q(R.nz(-3, 3));
    const lin = v === "cq" ? q(0) : q(R.int(-6, 6)), c0 = q(R.nz(-8, 8)), low = v === "cq" || R.chance(0.5);
    ftex = T.poly([k, lin, c0], "x", low); p = R.nz(-5, 5);
    y0 = evalPoly([k, lin, c0], p); m = k.mul(2 * p).add(lin); steps = quadSteps(k, lin, c0, low);
  } else if (v === "recip") {
    const k = R.pick([2, 4, 6, 8, -4, -6, 12]); p = R.pick([1, 2, -1, -2].filter((z) => Math.abs(k) % Math.abs(z) === 0));
    ftex = `\\frac{${k}}{x}`; y0 = q(k, p); m = q(-k, p * p); steps = derivSteps("recip", { k });
  } else if (v === "cubic") {
    const b = R.int(-4, 4); p = R.nz(-2, 2); ftex = T.poly([1, 0, b, 0]); y0 = q(p ** 3 + b * p); m = q(3 * p * p + b); steps = derivSteps("cubic", { b });
  } else {
    const r = R.int(1, 4); p = r * r; ftex = "\\sqrt{x}"; y0 = q(r); m = q(1, 2 * r); steps = derivSteps("sqrt", {});
  }
  const bb = y0.sub(m.mul(p));
  return {
    prompt: para(`Find an equation of the line tangent to the graph of ${$m(`f(x) = ${ftex}`)} at ${$m(`(${p}, ${y0.tex()})`)}.`),
    parts: [PP.line(`The equation of the tangent line to the graph of ${$m(`f(x) = ${ftex}`)} at ${$m(`(${p}, ${y0.tex()})`)} is`, m, bb)],
    hint: "Slope = f′(a) from the limit definition. Then y − y₁ = m(x − x₁), and solve for y.",
    solution: steps + $M(`m = f'(${p}) = ${m.tex()}`) + $M(`${T.pointSlope(m, p, y0)} \\;\\Rightarrow\\; ${T.line(m, bb)}`) +
      para(`Type only the right side in the box: ${$m(T.poly([m, bb]))}.`),
  };
};

PGEN.pwDiff = () => {
  const a = R.pick([1, 2, 3, 4, -1, -2]), p = R.pick([1, 1, -1, 2]), k = R.int(-6, 8);
  const L = p * a * a + k, slopeL = 2 * p * a, kind = R.pick(["corner", "corner", "smooth", "jump"]);
  let m; if (kind === "smooth") m = slopeL; else { do { m = R.nz(-6, 8); } while (m === slopeL); }
  let b = L - m * a; if (kind === "jump") b += R.pick([-3, -2, 2, 3]);
  const right = m * a + b, cont = right === L, diff = cont && m === slopeL;
  const Lt = T.poly([p, 0, k]), Rt = T.poly([m, b]);
  return {
    prompt: para(`Let ${$m("f")} be the following piecewise-defined function.`) + $M(`f(x) = \\begin{cases} ${Lt} & \\text{for } x \\le ${a} \\\\ ${Rt} & \\text{for } x > ${a} \\end{cases}`) +
      para(`(a) Is ${$m("f")} continuous at ${$m(`x = ${a}`)}?<br>(b) Is ${$m("f")} differentiable at ${$m(`x = ${a}`)}?`),
    parts: [PP.yn(`(a) Is ${$m("f(x)")} continuous at ${$m(`x = ${a}`)}?`, cont), PP.yn(`(b) Is ${$m("f(x)")} differentiable at ${$m(`x = ${a}`)}?`, diff)],
    hint: "Continuity: plug x = a into BOTH pieces — same height? Differentiability: also compare the slopes of the two pieces at x = a.",
    solution:
      para(`<b>(a)</b> Top piece at ${$m(`x = ${a}`)}: ${$m(`${p === 1 ? "" : p === -1 ? "-" : p}(${a})^2 ${k < 0 ? "-" : "+"} ${Math.abs(k)} = ${L}`)}. Bottom piece: ${$m(`${m}(${a}) ${b < 0 ? "-" : "+"} ${Math.abs(b)} = ${right}`)}. ${cont ? `Both give ${L}, so ${$m("f")} is <b>continuous</b>.` : `${L} ≠ ${right}: a jump, so <b>not continuous</b>.`}`) +
      para(`<b>(b)</b> ${cont ? `Slope of the top piece: its derivative is ${$m(`${2 * p}x`)}, which is ${$m(slopeL)} at ${$m(`x = ${a}`)}. Slope of the line: ${$m(m)}. ${m === slopeL ? "They match, so the pieces join smoothly → <b>differentiable</b>." : `${slopeL} ≠ ${m}, so the graph has a corner → <b>not differentiable</b>.`}` : "A function that isn't continuous at a point can't be differentiable there → <b>No</b>."}`),

PGEN.notDiffGraph = () => {
  const askCont = R.chance(0.3), xs = [1.5, 3.5, 5.5, 7.5, 9.5, 11.5];
  const view = { xmin: -0.8, xmax: 13.4, ymin: -1.8, ymax: 6.2, W: 580, H: 300, noGrid: true, noLabels: true, dotContinuous: true, padL: 16, padB: 30 };
  for (let attempt = 0; attempt < 400; attempt++) {
    const types = R.shuffle(["smooth", "smooth", "corner", "hole", "holePt", "jump", "asym"]).slice(0, 6);
    const nodes = [{ x: -1.4, yR: R.pick([0.5, 1, 1.5]), sR: 0.3 }];
    types.forEach((t, i) => {
      const y = R.pick([1.5, 2, 2.5, 3, 3.5]), s = R.pick([-0.6, -0.3, 0, 0.3, 0.6]), nd = { x: xs[i], t };
      if (t === "smooth") Object.assign(nd, { yL: y, yR: y, val: y, sL: s, sR: s });
      if (t === "corner") { const sl = R.pick([-1.6, 1.6]); Object.assign(nd, { yL: y, yR: y, val: y, sL: sl, sR: -sl }); }
      if (t === "hole") Object.assign(nd, { yL: y, yR: y, val: null, sL: s, sR: s });
      if (t === "holePt") Object.assign(nd, { yL: y, yR: y, val: y + R.pick([1.3, -1.3]), sL: s, sR: s });
      if (t === "jump") Object.assign(nd, { yL: y, yR: y + R.pick([-1.5, 1.5]), val: y, sL: s, sR: s });
      if (t === "asym") Object.assign(nd, { yL: R.pick([Infinity, -Infinity]), yR: R.pick([Infinity, -Infinity]), val: null, sL: 0, sR: 0 });
      nodes.push(nd);
    });
    nodes.push({ x: 14.2, yL: R.pick([1.5, 2.5]), sL: 0.3 });
    let ok = true;
    for (let i = 0; i < nodes.length - 1 && ok; i++) {
      const A = nodes[i], B = nodes[i + 1];
      if (!isFinite(A.yR) || !isFinite(B.yL)) continue;
      const f = Graph.segFn(A, B);
      for (let k = 1; k < 40; k++) { const y = f(A.x + ((B.x - A.x) * k) / 40); if (y < 0.3 || y > 5.4) { ok = false; break; } }
    }
    nodes.forEach((nd) => { [nd.yL, nd.yR, nd.val].forEach((y) => { if (y != null && isFinite(y) && (y < 0.4 || y > 5.2)) ok = false; }); });
    if (!ok) continue;
    const inner = nodes.slice(1, -1), infos = inner.map(Graph.info);
    const svg = Graph.drawPiecewise(nodes, {
      ...view,
      extras(g) {
        inner.forEach((nd, i) => {
          const tops = [nd.yL, nd.yR, nd.val].filter((y) => y != null && isFinite(y));
          if (tops.length) g.raw(`<line class="gp-asym" x1="${g.X(nd.x)}" y1="${g.Y(0)}" x2="${g.X(nd.x)}" y2="${g.Y(Math.max(...tops))}"/>`);
          g.raw(`<text class="gp-name" text-anchor="middle" x="${g.X(nd.x)}" y="${g.Y(0) + 20}">x<tspan dy="4" font-size="11">${i}</tspan></text>`);
        });
      },
    }, "graph with labeled points x0 through x5");
    const order = R.shuffle([0, 1, 2, 3, 4, 5]);
    const bad = (i) => (askCont ? !infos[i].continuous : !infos[i].differentiable);
    const choices = order.map((i) => $m(`x_{${i}}`));
    const ans = order.map((i, j) => (bad(i) ? j : -1)).filter((j) => j >= 0);
    const why = (n, i) => {
      const lab = $m(`x_{${i}}`);
      if (n.differentiable) return `${lab}: smooth and unbroken → continuous and differentiable.`;
      if (n.corner) return `${lab}: a sharp corner → continuous, but <b>not differentiable</b>.`;
      if (n.type === "infinite") return `${lab}: vertical asymptote → not continuous, not differentiable.`;
      if (n.type === "jump") return `${lab}: the graph jumps → not continuous, not differentiable.`;
      return `${lab}: a hole (open circle${n.value !== "DNE" ? ", with the point moved elsewhere" : ""}) → not continuous, not differentiable.`;
    };
    return {
      prompt: para(`List the points in the graph at which the function is <b>not ${askCont ? "continuous" : "differentiable"}</b>.`),
      figure: svg,
      parts: [PP.multi(`Select all that apply.`, choices, ans)],
      hint: askCont ? "Not continuous: holes, jumps, vertical asymptotes. Corners ARE continuous." : "Not differentiable: corners, holes, jumps, vertical asymptotes (and vertical tangents). Smooth points are fine.",
      solution: infos.map((n, i) => para(why(n, i))).join("") + para(askCont ? "Corners are the trap: no break in the graph, so they're continuous even though they aren't differentiable." : "Every discontinuity is also a non-differentiable point, plus the corners."),
    };
  }
  throw new Error("notDiffGraph generation failed");
};

function tableXs(fam) {
  const offs = fam.big ? [0.1, 0.01, 0.001] : R.pick([[0.1, 0.01, 0.001], [0.5, 0.1, 0.01], [0.01, 0.001, 0.0001]]);
  return [-offs[0], -offs[1], -offs[2], offs[2], offs[1], offs[0]].map((d) => +(fam.a + d).toFixed(4));
}
const tableHead = (fam, xs) => xs.slice(0, 3).map((x) => `<td>${fmtDec(x, 4)}</td>`).join("") + `<td class="qmark">${fam.a}</td>` + xs.slice(3).map((x) => `<td>${fmtDec(x, 4)}</td>`).join("");
const tableReading = (fam) => {
  const left = fam.left ?? fam.L, right = fam.right ?? fam.L;
  return para(`Reading the left three columns, the outputs head toward ${$m(T.ans(left))}; the right three head toward ${$m(T.ans(right))}.`) +
    para(fam.L === "DNE" ? "The two sides disagree (or run off in opposite directions), so the two-sided limit does not exist." : `Both sides agree, so the limit is ${$m(T.ans(fam.L))}.`);
};

GEN.numTable = () => {
  const fam = R.pick(TABLE_FAMILIES)(), xs = tableXs(fam), a = fam.a;
  const left = fam.left ?? fam.L, right = fam.right ?? fam.L, tol = { approx: 0.011 };
  const vals = xs.slice(0, 3).map((x) => `<td>${fmtDec(fam.fn(x), 6)}</td>`).join("") + `<td class="qmark">?</td>` + xs.slice(3).map((x) => `<td>${fmtDec(fam.fn(x), 6)}</td>`).join("");
  const table = `<div class="tbl-wrap"><table class="vt"><tr><th>${$m("x")}</th>${tableHead(fam, xs)}</tr><tr><th>${$m("f(x)")}</th>${vals}</tr></table></div>`;
  return {
    prompt: para(`Let ${$m(`f(x) = ${fam.tex}`)}. Use the table to see what the outputs do as ${$m("x")} approaches ${$m(a)}.`) + table,
    parts: [
      P.mc(`Can you find ${$m(`${T.lim(a)} f(x)`)} just by plugging in ${$m(`x = ${a}`)}?`, [
        `Yes — ${$m(`f(${a})`)} is defined, so substitute`,
        `No — ${$m(`x = ${a}`)} makes a denominator 0, so ${$m(`f(${a})`)} is undefined`,
      ], fam.noHole ? 0 : 1),
      P.num(`As ${$m(`x \\to ${a}^-`)}, ${$m("f(x)")} approaches…`, left, tol),
      P.num(`As ${$m(`x \\to ${a}^+`)}, ${$m("f(x)")} approaches…`, right, tol),
      P.num($m(`${T.lim(a)} f(x) =`), fam.L, { ...tol, dneOk: true }),
    ],
    hint: "Left three columns → left-hand limit. Right three → right-hand limit. Same value on both sides → that's the limit. Opposite directions or different values → DNE.",
    solution: tableReading(fam) + $M(`${T.lim(a)} ${fam.tex} = ${T.ans(fam.L)}`) + para(`Why: ${$m(fam.why)}`),
  };
};

GEN.arcShrink = () => {
  const fams = [
    () => { const k = R.pick([1, 2, 3, 4, 6, -2]), a = R.pick([1, 2, 3]); return { tex: `\\frac{${k}}{x}`, a, f: (x) => q(k).div(x), d: q(-k, a * a), dWhy: `-\\frac{${k}}{x^2}` }; },
    () => { const c = R.pick([q(1), q(2), q(-1), q(1, 2), q(3)]), dd = R.int(-4, 6), a = R.pick([1, 2, 3, -1, -2]); return { tex: T.poly([c, 0, dd]), a, f: (x) => c.mul(Q.of(x).mul(x)).add(dd), d: c.mul(2 * a), dWhy: T.poly([c.mul(2), 0]) }; },
    () => { const a = R.pick([1, -1, 2]); return { tex: "x^3", a, f: (x) => Q.of(x).pow(3), d: q(3 * a * a), dWhy: "3x^2" }; },
    () => { const r = R.int(1, 4); return { tex: "\\sqrt{x}", a: r * r, fnum: (x) => Math.sqrt(x), d: q(1, 2 * r), dWhy: "\\frac{1}{2\\sqrt{x}}" }; },
  ];

  const deltas = R.pick([[3, 1, 0.5, 0.05], [2, 1, 0.1, 0.01], [1, 0.5, 0.1, 0.001]]);
  const arcs = deltas.map((dl) => (F.f ? F.f(q(F.a).add(q(dl))).sub(F.f(F.a)).div(q(dl)) : (F.fnum(F.a + dl) - F.fnum(F.a)) / dl));
  const L = F.d, seen = new Set(), choices = [];
  [L, L.neg(), L.mul(2), L.add(1), L.sub(1)].forEach((c) => { if (!seen.has(c.txt())) { seen.add(c.txt()); choices.push(c); } });
  const show = (v) => (v instanceof Q ? `${v.tex()}${v.isInt() ? "" : ` \\approx ${fmtDec(v.val(), 4)}`}` : `\\approx ${fmtDec(v, 4)}`);

    prompt: para(`Let ${$m(`f(x) = ${F.tex}`)}. Calculate the average rate of change of ${$m("f")} over each interval. (Rounded answers to 2+ decimal places are fine.)`),
    parts: [
      ...deltas.map((dl, i) => P.num($m(`[${F.a},\\ ${fmtDec(F.a + dl, 4)}]`), arcs[i], { approx: 0.0051 })),
      P.mc(`As the interval shrinks toward ${$m(`x = ${F.a}`)}, these values approach…`, choices.slice(0, 4).map((c) => $m(c.tex())), 0),
    ],
    hint: `ARC on [a, b] = (f(b) − f(a)) / (b − a). Start with f(${F.a}).`,
    solution: deltas.map((dl, i) => $M(`[${F.a},\\ ${fmtDec(F.a + dl, 4)}]:\\quad \\frac{f(${fmtDec(F.a + dl, 4)}) - f(${F.a})}{${fmtDec(dl, 4)}} ${show(arcs[i]).startsWith("\\approx") ? "" : "="} ${show(arcs[i])}`)).join("") +
      para(`Each value is the slope of a secant line through ${$m(`(${F.a}, f(${F.a}))`)}. As the interval shrinks they approach the slope of the <b>tangent line</b>: ${$m(`f'(x) = ${F.dWhy}`)}, so ${$m(`f'(${F.a}) = ${L.tex()}`)}.`),
  };
};

// Don't repeat any of the last few questions for a topic in practice
const recentPrompts = {};
function freshProblem(make, id) {
  const sig = (p) => (p.prompt + (p.figure || "")).replace(/clip\d+/g, "");
  const seen = recentPrompts[id] || (recentPrompts[id] = []);
  let pr;
  for (let i = 0; i < 10; i++) { pr = make(id); if (!seen.includes(sig(pr))) break; }
  seen.push(sig(pr));
  if (seen.length > 6) seen.shift();
  return pr;
}

      grade: () => PCheck[part.type](inp.value, part), empty: () => !inp.value.trim(),
      yours: () => escapeHtml(inp.value || "(blank)"),
      lock() { inp.disabled = true; }, clear() { inp.value = ""; preview.innerHTML = ""; },
    };
  }
  sec.append(bar);
  Object.assign(api, { sec, bar, part });
  return api;
}

// mode: "try" (a retry is allowed), "final" (show the correct answer)
function pqShow(api, res, mode) {
  api.sec.classList.remove("ok", "bad");
  api.bar.hidden = false;
  if (res.empty && mode === "try") { api.bar.className = "pq-bar"; api.bar.innerHTML = "Answer this part, then check again."; return; }
  const ok = !!res.ok;
  api.sec.classList.add(ok ? "ok" : "bad");
  api.bar.className = `pq-bar ${ok ? "ok" : "bad"}`;
  let h = ok ? "<b>Good job!</b>" : mode === "try" ? "<b>That's not right.</b> You have one more try." : "<b>That's incorrect.</b>";
  if (res.err) h += `<div class="pq-err">${res.err}</div>`;
  if (res.note) h += `<div>${res.note}</div>`;
  if (!ok && mode === "final") h += `<div class="pq-cmp"><div><span>Correct answer:</span> ${pAnswerText(api.part)}</div><div><span>Your answer:</span> ${api.yours()}</div></div>`;
  api.bar.innerHTML = h;
}

function pqCard(pr, meta) {
  const card = el("article", { class: "sheet pq-card" });
  const nParts = pr.parts.length;
  const head = el("div", { class: "pq-head" },
    `<div><div class="pq-code">${meta.num ? `Question ${meta.num}` : meta.title}</div><div class="pq-meta">${nParts} part${nParts > 1 ? "s" : ""}<span class="pq-sep">|</span><span class="pq-score">0 of 1 point</span></div></div><span class="tag">${/^\d/.test(meta.sec) ? "§" : ""}${meta.sec}${meta.num ? ` · ${meta.title}` : ""}</span>`);
  const promptBox = el("div", { class: "pq-prompt" }, pr.prompt);
  if (pr.figure) { promptBox.append(el("div", { class: "figure" }, pr.figure)); if (pr.figure.includes("gp-guide")) promptBox.append(guideToggle()); }
  card.append(head, promptBox);
  const ctrls = pr.parts.map((p, i) => { const api = pqPartView(p, i, nParts); card.append(api.sec); return api; });
  const setScore = (fr) => { head.querySelector(".pq-score").textContent = `${+fr.toFixed(2)} of 1 point`; };
  return { card, ctrls, setScore };
}

function runPTest(test, minutes) {
  clearInterval(examTimer);
  const main = document.getElementById("main"); main.innerHTML = "";
  const problems = withSeed(test.seed, () => (test.blueprint || PTEST_BLUEPRINT).map((id) => ({ id, pr: makePProblem(id) })));
  const bar = el("div", { class: "exam-bar" });
  bar.innerHTML = `<span class="clock" id="clock">${minutes ? `${minutes}:00` : "∞"}</span><span class="meta">${test.name}<br><span class="pt-pos">Question 1 of ${problems.length}</span></span>`;
  bar.append(btn("Submit test", "", () => trySubmit()));
  const confirmRow = el("div", { class: "pt-confirm sheet", hidden: "" });
  const nav = el("nav", { class: "pt-nav", "aria-label": "Questions" });
  main.append(bar, confirmRow, nav);
  let cur = 0, done = false;
  const views = problems.map((p, i) => {
    const t = PTOPIC_BY_ID[p.id];
    const v = pqCard(p.pr, { title: t.name, sec: t.sec, num: i + 1 });
    v.card.hidden = i !== 0;
    main.append(v.card);
    const nb = el("button", { type: "button", class: "pt-q", "aria-label": `Question ${i + 1}`, onclick: () => go(i) }, String(i + 1));
    nav.append(nb);
    const mark = () => { if (!done) nb.classList.toggle("answered", !v.ctrls.every((c) => c.empty())); };
    v.card.addEventListener("input", mark); v.card.addEventListener("change", mark);
    return { ...p, ...v, nb };
  });
  const prev = btn("← Previous", "ghost", () => go(cur - 1)), next = btn("Next →", "primary", () => go(cur + 1));
  const pager = el("div", { class: "actions pt-pager" }); pager.append(prev, next);
  main.append(pager);
  function go(i) {
    if (i < 0 || i >= views.length) return;
    views[cur].card.hidden = true; views[cur].nb.removeAttribute("aria-current");
    cur = i; views[cur].card.hidden = false; views[cur].nb.setAttribute("aria-current", "true");
    const pos = bar.querySelector(".pt-pos"); if (pos) pos.textContent = `Question ${cur + 1} of ${views.length}`;
    prev.disabled = cur === 0; next.disabled = cur === views.length - 1;
    window.scrollTo({ top: 0 });
  }
  go(0);
  typeset(main);
  const end = Date.now() + minutes * 60000;
  if (minutes) {
    examTimer = setInterval(() => {
      const left = Math.max(0, end - Date.now()), m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      const clock = document.getElementById("clock"); if (clock) clock.textContent = `${m}:${String(s).padStart(2, "0")}`;
      if (left <= 0) grade(true);
    }, 1000);
  }
  function trySubmit() {
    if (done) return;
    const blank = views.filter((v) => v.ctrls.every((c) => c.empty())).length;
    if (blank && confirmRow.hidden) {
      confirmRow.hidden = false; confirmRow.innerHTML = "";
      confirmRow.append(el("span", {}, `${blank} question${blank > 1 ? "s are" : " is"} still unanswered.`), btn("Submit anyway", "primary", () => grade(false)), btn("Keep working", "ghost", () => { confirmRow.hidden = true; }));
      return;
    }
    grade(false);
  }
  function grade(timeUp) {
    if (done) return; done = true; clearInterval(examTimer);
    confirmRow.remove(); bar.remove();
    let total = 0; const bySec = {};
    views.forEach((v) => {
      const res = v.ctrls.map((c) => c.grade());
      v.ctrls.forEach((c, i) => { pqShow(c, res[i], "final"); c.lock(); });
      const fr = res.filter((r) => r.ok).length / res.length;
      v.setScore(fr); total += fr;
      recordResult({ catalog: "pgen", id: v.id, mode: "ptest", pr: v.pr, results: res, helped: false, attempts: 1, answers: v.ctrls.map((c) => c.yours()), test: test.name });
      const sec = PTOPIC_BY_ID[v.id].sec; bySec[sec] = bySec[sec] || [0, 0]; bySec[sec][0] += fr; bySec[sec][1]++;
      v.nb.classList.remove("answered"); v.nb.classList.add(fr === 1 ? "full" : fr > 0 ? "partial" : "zero");
      v.card.append(el("details", { class: "solution" }, `<summary class="sol-lbl" style="cursor:pointer">Help me solve this</summary>${v.pr.solution}`));
    });
    const pct = Math.round((100 * total) / views.length);
    recordTest({ name: test.name, kind: "ptest", pct, bySec });
    if (test.key) { state.mockScores[test.key] = Math.max(state.mockScores[test.key] ?? 0, pct); persist(); renderPearsonRail(); }
    const weakest = Object.entries(bySec).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])[0];
    const res = el("section", { class: "sheet" });
    res.innerHTML = `<div class="sheet-head"><h3>${timeUp ? "Time's up — " : ""}${test.name} results</h3><span class="tag">graded</span></div>
      <div class="result"><span class="big">${pct}%</span><span>${+total.toFixed(2)} of ${views.length} points</span>
      <table>${Object.entries(bySec).map(([s, [a, b]]) => `<tr><td>§${s}</td><td>${+a.toFixed(2)}/${b}</td><td>${Math.round((100 * a) / b)}%</td></tr>`).join("")}</table></div>
      <p class="prompt" style="margin-top:10px">Click a question number to review it: <span class="pt-key full">full credit</span> <span class="pt-key partial">partial</span> <span class="pt-key zero">no credit</span>. Your weakest area was <b>§${weakest[0]}</b>. Practice those question types from the list on the left, then retake.</p>`;
    const acts = el("div", { class: "actions" });
    acts.append(btn("Back to tests", "primary", renderPTestHome), btn("Retake this test", "", () => runPTest(test, minutes)));
    res.append(acts);
    main.insertBefore(res, nav);
    typeset(main);
    go(cur);
  }
}

// ---------- mistake classification ----------
function numVal(raw) { try { const v = Parser.ev(Parser.parse(rhs(String(raw))), {}); return isFinite(v) ? v : null; } catch (e) { return null; } }
function valueMistake(part, raw) {
  const a = part.ans;
  if (a === Infinity || a === -Infinity) return numVal(raw) === null && /inf/i.test(String(raw)) ? "wrong sign on an infinite limit" : "missed an infinite limit";
  const want = a instanceof Q ? a.val() : typeof a === "number" ? a : null, got = numVal(raw);
  if (want == null || got == null) return "wrong value";
  if (Math.abs(want) > 1e-9 && closeTo(got, -want)) return "sign error";
  if (Math.abs(want) > 1e-9 && Math.abs(got) > 1e-9 && closeTo(got, 1 / want)) return "flipped the fraction (reciprocal)";
  return "wrong value";
}
function classify(part, res, answer, helped) {
  if (!res || res.ok) return null;
  if (res.empty) return helped ? "opened the solution instead" : "left blank";
  const err = res.err || "";
  if (/flipped/i.test(err)) return "units flipped";
  if (/two units/i.test(err)) return "units incomplete";
  if (/not simplified|reduce it/i.test(err)) return "fraction not simplified";
  if (/exact value|rounded decimal/i.test(err)) return "rounded instead of exact";
  if (/still contains h/i.test(err)) return "left h in the derivative";
  if (/h in the denominator/i.test(err)) return "didn't cancel the h";
  if (/Expand completely/i.test(err)) return "didn't expand completely";
  if (/factored form/i.test(err)) return "not in factored form";
  if (/slope-intercept/i.test(err)) return "not in slope-intercept form";
  const ansStr = String(answer ?? "");
  switch (part.type) {
    case "cf": {
      const none = part.ans === "DNE" || part.ans === "NONE", choice = /^A/.test(ansStr) ? "A" : /^B/.test(ansStr) ? "B" : null;
      if (none && choice === "A") return part.list ? "listed discontinuities that don't exist" : "said a limit/value exists when it doesn't";
      if (!none && choice === "B") return part.ans === Infinity || part.ans === -Infinity ? "chose DNE for an infinite limit" : part.list ? "missed the discontinuities" : "said DNE when it exists";
      if (part.list) return "wrong discontinuity values";
      return valueMistake(part, ansStr.replace(/^A\.\s*/, ""));
    }
    case "num": {
      if (part.ans === "DNE") return "gave a value when it's DNE/undefined";
      if (/dne|undefined|does/i.test(ansStr)) return part.ans === Infinity || part.ans === -Infinity ? "wrote DNE for an infinite limit" : "said DNE when a value exists";
      return valueMistake(part, ansStr);
    }
    case "units": return "wrong units";
    case "expr": return "wrong expression";
    case "line": {
      if (ansStr.includes("=") && !/^\s*y\s*=/.test(ansStr)) return "wrong tangent line";
      const f = (x) => { try { return Parser.ev(Parser.parse(rhs(ansStr)), { x }); } catch (e) { return NaN; } };
      const slope = f(1) - f(0), m = Q.of(part.m).val();
      if (!isFinite(slope)) return "wrong tangent line";
      if (closeTo(slope, m)) return "tangent line: right slope, wrong intercept";
      if (Math.abs(m) > 1e-9 && closeTo(slope, -m)) return "tangent line: slope sign error";
      return "tangent line: wrong slope";
    }
    case "multi": return "select-all: wrong set";
    case "mc":
      if (part.choices[0] === "Yes") return "Yes/No wrong";
      if (part.choices[0] === "True") return "True/False wrong";
      return "wrong choice";
    default: return "wrong answer";
  }
}

// ---------- recording ----------
function recordResult({ catalog, id, mode, pr, results, finalResults, helped, attempts, answers, test }) {
  const progress = catalog === "pgen" ? state.pprogress : state.progress;
  const p = progress[id] || (progress[id] = { tries: 0, solved: 0, streak: 0 });
  const res = results || finalResults || [];
  const firstOk = res.length > 0 && res.every((r) => r.ok) && !helped;
  p.tries++;
  if (firstOk) { p.solved++; p.streak = (p.streak || 0) + 1; p.best = Math.max(p.best || 0, p.streak); } else p.streak = 0;
  const parts = pr.parts.map((part, i) => {
    const r = res[i] || { empty: true }, o = { t: part.type, ok: !!r.ok };
    if (!r.ok) {
      o.kind = classify(part, r, answers?.[i], helped);
      o.q = plain(part.label || part.prefix || "").slice(0, 140);
      o.you = plain(answers?.[i] ?? "").slice(0, 80);
      o.ans = plain(pAnswerText(part)).slice(0, 120);
    }
    return o;
  });
  const skill = SKILL_OF[id];
  const entry = { id: newId(), t: Date.now(), mode, topic: id, skill: skill ? skill.id : id, sec: skill ? skill.sec : "", ok: parts.filter((x) => x.ok).length, n: parts.length, first: firstOk, helped: !!helped, tries: attempts || 1, parts, prompt: plain(pr.prompt).slice(0, 220) };
  if (test) entry.test = test;
  if (finalResults && finalResults !== results) entry.finalOk = finalResults.filter((r) => r.ok).length;
  state.log.push(entry);
  persist();
  Sync.touch();
}
function recordTest({ name, kind, pct, bySec }) {
  const secs = {};
  Object.entries(bySec || {}).forEach(([s, [a, b]]) => { secs[s] = Math.round((100 * a) / b); });
  state.tests.push({ id: newId(), t: Date.now(), name, kind, pct, secs });
  persist();
  Sync.touch();
}

// ---------- statistics ----------
function computeStats() {
  const bySkill = {};
  SKILLS.forEach((s) => { bySkill[s.id] = { skill: s, n: 0, first: 0, parts: 0, partsOk: 0, recent: [], last: 0 }; });
  const mistakes = {}, bySec = {};
  state.log.forEach((e) => {
    const b = bySkill[e.skill];
    if (b) { b.n++; if (e.first) b.first++; b.parts += e.n; b.partsOk += e.ok; b.recent.push(e.first ? 1 : e.ok > 0 ? 0.5 : 0); b.last = e.t; }
    if (e.sec && e.sec !== "all") { const s = bySec[e.sec] || (bySec[e.sec] = { n: 0, first: 0 }); s.n++; if (e.first) s.first++; }
    e.parts.forEach((p) => {
      if (p.ok || !p.kind || p.kind === "left blank" || p.kind === "opened the solution instead") return;
      const m = mistakes[p.kind] || (mistakes[p.kind] = { kind: p.kind, count: 0, skills: {}, examples: [] });
      m.count++; m.skills[e.skill] = (m.skills[e.skill] || 0) + 1;
      m.examples.push({ q: p.q, you: p.you, ans: p.ans, topic: e.topic, t: e.t, prompt: e.prompt });
      if (m.examples.length > 3) m.examples.shift();
    });
  });
  const mlist = Object.values(mistakes).sort((a, b) => b.count - a.count);
  Object.values(bySkill).forEach((b) => {
    b.acc = b.n ? b.first / b.n : null;
    b.partAcc = b.parts ? b.partsOk / b.parts : null;
    b.last5 = b.recent.slice(-5);
    b.recentAcc = b.last5.length ? b.last5.reduce((a, c) => a + c, 0) / b.last5.length : null;
    b.streak = Math.max(0, ...b.skill.topics.map((t) => Math.max(state.progress[t]?.streak || 0, state.pprogress[t]?.streak || 0)));
    b.status = b.n === 0 ? "untested" : b.streak >= 3 ? "mastered" : b.n >= 2 && b.recentAcc < 0.5 ? "gap" : b.acc < 0.75 || b.recentAcc < 0.75 ? "shaky" : "good";
    b.topMistake = mlist.find((m) => m.skills[b.skill.id]);
  });
  const log = state.log;
  return {
    bySkill, bySec, mistakes: mlist,
    total: log.length,
    firstRate: log.length ? log.filter((e) => e.first).length / log.length : null,
    partRate: log.length ? log.reduce((a, e) => a + e.ok, 0) / Math.max(1, log.reduce((a, e) => a + e.n, 0)) : null,
    recentRate: log.length ? log.slice(-20).filter((e) => e.first).length / Math.min(20, log.length) : null,
  };
}
const pct = (x) => (x == null ? "—" : `${Math.round(100 * x)}%`);
const when = (t) => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function buildReport(S) {
  const L = [];
  L.push(`# MAT 213 study analytics (generated ${new Date().toLocaleString()})`);

  L.push(`Totals: ${S.total} questions answered; first-try full credit ${pct(S.firstRate)}; parts correct ${pct(S.partRate)}; last 20 questions ${pct(S.recentRate)}.`);
  L.push("", "## By section");
  ["alg", "1.1", "1.2", "1.3", "1.4"].forEach((s) => { const v = S.bySec[s]; L.push(`- ${s === "alg" ? "Algebra warm-up" : "§" + s}: ${v ? `${pct(v.first / v.n)} first-try over ${v.n} questions` : "not practiced"}`); });
  L.push("", "## Skills (weakest first)", "| Skill | § | Status | First-try | Last 5 | Streak | Attempts | Most common mistake |", "|---|---|---|---|---|---|---|---|");
  Object.values(S.bySkill).sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]).forEach((b) => {
    L.push(`| ${b.skill.name} | ${b.skill.sec} | ${STATUS_LABEL[b.status]} | ${pct(b.acc)} | ${b.last5.map((x) => (x === 1 ? "✓" : x > 0 ? "½" : "✗")).join("") || "—"} | ${b.streak} | ${b.n} | ${b.topMistake ? b.topMistake.kind : "—"} |`);
  });
  L.push("", "## Mistake patterns");
  if (!S.mistakes.length) L.push("- none recorded yet");
  S.mistakes.slice(0, 12).forEach((m) => {
    const where = Object.entries(m.skills).sort((a, b) => b[1] - a[1]).map(([k, c]) => `${SKILLS.find((s) => s.id === k)?.name || k} ×${c}`).join(", ");
    L.push(`- **${m.kind}** — ${m.count}× (${where})`);
    m.examples.slice(-2).forEach((x) => L.push(`  - ${x.prompt.slice(0, 120)} | part: ${x.q} | you: ${x.you || "(blank)"} | correct: ${x.ans}`));
  });
  L.push("", "## Recent misses (newest first)");
  state.log.filter((e) => !e.first).slice(-15).reverse().forEach((e) => {
    const miss = e.parts.filter((p) => !p.ok).map((p) => `${p.kind}: you "${p.you || "blank"}", correct "${p.ans}"`).join("; ");
    L.push(`- ${when(e.t)} · ${SKILL_OF[e.topic]?.name || e.topic} · ${e.mode}${e.test ? ` (${e.test})` : ""} · ${e.ok}/${e.n} parts · ${e.prompt.slice(0, 100)} → ${miss}`);

  L.push("", "Please use this to build a targeted practice exam in the Pearson format that focuses on my gaps and mistake patterns.");
  return L.join("\n");
}

// ---------- cloud sync (only inside the published page; the local copy keeps data in the browser) ----------
const Sync = (() => {
  let db = null, ready = false, timer = null, status = "local";
  const CHUNK = 100;
  const listeners = new Set();
  const setStatus = (s) => { status = s; listeners.forEach((fn) => fn(s)); };
  async function init() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return;
    try {
      const snap = await db.collection("attempts").get();
      const ids = new Set(state.log.map((e) => e.id));
      let added = 0;
      snap.docs.forEach((d) => { const body = d.data(); (body && Array.isArray(body.entries) ? body.entries : []).forEach((e) => { if (e && e.id && !ids.has(e.id)) { state.log.push(e); ids.add(e.id); added++; } }); });
      state.log.sort((a, b) => a.t - b.t);
      const t = await db.doc("analytics/tests").get();
      if (t.exists) { const tids = new Set(state.tests.map((x) => x.id)); (t.data().tests || []).forEach((x) => { if (x && x.id && !tids.has(x.id)) { state.tests.push(x); added++; } }); state.tests.sort((a, b) => a.t - b.t); }
      const pg = await db.doc("analytics/progress").get();
      if (pg.exists && !Object.keys(state.progress).length && !Object.keys(state.pprogress).length) {
        const body = pg.data(); state.progress = { ...(body.progress || {}) }; state.pprogress = { ...(body.pprogress || {}) }; state.mockScores = { ...(body.mockScores || {}), ...state.mockScores };
      }
      ready = true; setStatus("synced");
      persist();
      if (added && (state.mode === "stats" || state.mode === "pearson" || state.mode === "practice")) render();
      touch();
    } catch (e) { console.warn("sync init failed", e); db = null; setStatus("local"); }
  }
  function touch() { if (!db || !ready) return; clearTimeout(timer); timer = setTimeout(flush, 2000); }
  async function flush() {
    try {
      const log = state.log;
      for (let c = 0; c * CHUNK < log.length; c++) await db.doc(`attempts/chunk-${String(c).padStart(4, "0")}`).set({ entries: JSON.parse(JSON.stringify(log.slice(c * CHUNK, (c + 1) * CHUNK))), updated: Date.now() });
      await db.doc("analytics/tests").set({ tests: JSON.parse(JSON.stringify(state.tests.slice(-200))) });
      await db.doc("analytics/progress").set({ progress: JSON.parse(JSON.stringify(state.progress)), pprogress: JSON.parse(JSON.stringify(state.pprogress)), mockScores: { ...state.mockScores }, updated: Date.now() });
      const S = computeStats();
      await db.doc("analytics/summary").set({ updated: Date.now(), total: S.total, firstRate: S.firstRate, report: buildReport(S) });
      setStatus("synced");
    } catch (e) {
      console.warn("sync failed", e);
      setStatus(e && e.code === "quota_exceeded" ? "full" : "error");
      if (e && e.code === "unavailable") { clearTimeout(timer); timer = setTimeout(flush, 5000 + Math.random() * 5000); }
    }
  }
  async function reset() {
    if (!db || !ready) return;
    try {
      const snap = await db.collection("attempts").get();
      for (const d of snap.docs) await db.doc(`attempts/${d.id}`).delete();
      await flush();
    } catch (e) { console.warn("sync reset failed", e); }
  }
  return { init, touch, reset, status: () => status, onStatus: (fn) => { listeners.add(fn); return () => listeners.delete(fn); } };
})();
setTimeout(() => Sync.init(), 0);
