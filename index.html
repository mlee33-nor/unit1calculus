<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAT 213 Midterm Lab</title>
<meta name="description" content="Practice limits, continuity, average rates, and derivatives for the MAT 213 midterm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>:root {
  --paper: #edf1ee;
  --sheet: #fafbf9;
  --ink: #16222a;
  --graphite: #56646b;
  --faint: #8a979c;
  --grid: #d6dfdb;
  --grid-strong: #b8c6c0;
  --curve: #c23b2a;
  --curve-soft: #f6e1dc;
  --ok: #2b7a4b;
  --ok-soft: #dcefe3;
  --bad: #b3261e;
  --bad-soft: #f9e0dc;
  --focus: #1f5fbf;
  --shadow: 0 1px 0 rgba(22, 34, 42, 0.06), 0 8px 24px -12px rgba(22, 34, 42, 0.18);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "STIX Two Text", "Cambria", "Georgia", serif;
  --f-mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1513; --sheet: #151e1b; --ink: #e2eae6; --graphite: #9aa9a3; --faint: #6f7f78;
    --grid: #22302b; --grid-strong: #34463f; --curve: #f07a63; --curve-soft: #3a221d;
    --ok: #6cc793; --ok-soft: #17301f; --bad: #ff8b7b; --bad-soft: #3a1d19; --focus: #7fb0ff;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  }
}
:root[data-theme="dark"] {
  --paper: #0e1513; --sheet: #151e1b; --ink: #e2eae6; --graphite: #9aa9a3; --faint: #6f7f78;
  --grid: #22302b; --grid-strong: #34463f; --curve: #f07a63; --curve-soft: #3a221d;
  --ok: #6cc793; --ok-soft: #17301f; --bad: #ff8b7b; --bad-soft: #3a1d19; --focus: #7fb0ff;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font: 17px/1.55 var(--f-body);
  padding-inline: 16px;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--paper); padding: 0 0.3em; border-radius: 3px; }

/* ---------- masthead ---------- */
.mast { max-width: 1240px; margin: 0 auto; padding-block: 22px 14px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.brand { display: grid; gap: 2px; }
.brand h1 { margin: 0; font: 800 clamp(30px, 4.4vw, 44px)/0.95 var(--f-display); letter-spacing: -0.02em; font-variation-settings: "opsz" 96; text-wrap: balance; }
.brand h1 .lim { color: var(--curve); font-weight: 700; }
.brand .sub { font: 500 12px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); }
.countdown { display: flex; align-items: center; gap: 12px; background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow); }
.countdown .num { font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--curve); }
.countdown .lbl { font: 500 11px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--graphite); }
.countdown .lbl b { display: block; color: var(--ink); font-weight: 600; letter-spacing: 0.02em; text-transform: none; font-size: 13px; }

.modes { max-width: 1240px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.modes button { border: 1px solid var(--grid-strong); background: var(--sheet); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: 500 13px/1.2 var(--f-mono); letter-spacing: 0.02em; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.modes button:hover:not([aria-pressed="true"]) { border-color: var(--ink); }

/* ---------- layout ---------- */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 22px; align-items: start; padding-block-end: 60px; }
.rail { position: sticky; top: 12px; background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 12px; padding: 14px 10px; max-height: calc(100vh - 24px); overflow: auto; }
.rail h2 { margin: 12px 8px 4px; font: 600 11px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--graphite); display: flex; justify-content: space-between; gap: 8px; }
.rail h2:first-child { margin-top: 0; }
.rail h2 span:last-child { color: var(--faint); letter-spacing: 0.02em; text-transform: none; }
.rail ul { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 1px; }
.rail button { width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font: 500 14px/1.25 var(--f-display); }
.rail button:hover { background: var(--paper); }
.rail button[aria-current="true"] { background: var(--ink); color: var(--sheet); }
.rail button[aria-current="true"] .pips i { border-color: var(--sheet); }
.rail button[aria-current="true"] .pips i.on { background: var(--sheet); }
.pips { display: flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--grid-strong); display: block; }
.pips i.on { background: var(--ok); border-color: var(--ok); }
.rail .legend { margin: 10px 8px 0; font: 400 11px/1.4 var(--f-mono); color: var(--faint); }

.main { display: grid; gap: 18px; min-width: 0; }

/* ---------- problem sheet ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 12px; box-shadow: var(--shadow); padding: 22px clamp(16px, 3vw, 32px) 24px; min-width: 0; }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; border-bottom: 1px dashed var(--grid-strong); padding-bottom: 10px; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font: 700 22px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.tag { font: 600 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--curve); }
.qnum { font: 800 15px/1 var(--f-display); color: var(--graphite); margin-right: 8px; }
.prompt p { margin: 0 0 10px; max-width: 68ch; }
.prompt mjx-container[display="true"] { margin: 10px 0 !important; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.figure { margin: 6px 0 14px; }
svg.graph { width: 100%; max-width: 440px; height: auto; display: block; background: var(--sheet); border: 1px solid var(--grid); border-radius: 8px; }
.gp-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.gp-axis { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.gp-curve { stroke: var(--curve); stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.gp-open { fill: var(--sheet); stroke: var(--curve); stroke-width: 2.2; }
.gp-closed { fill: var(--curve); stroke: var(--curve); stroke-width: 1; }
.gp-asym { stroke: var(--graphite); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.gp-cross { stroke: var(--ink); stroke-width: 2; fill: none; }
.gp-lab { fill: var(--graphite); font: 500 11px var(--f-mono); }
.gp-name { fill: var(--ink); font: italic 14px var(--f-body); }

.tbl-wrap { overflow-x: auto; margin: 6px 0 14px; }
table.vt { border-collapse: collapse; font: 500 13px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
table.vt th, table.vt td { border: 1px solid var(--grid-strong); padding: 7px 9px; text-align: center; white-space: nowrap; }
table.vt th { background: var(--paper); font-weight: 600; }
table.vt td.qmark { color: var(--curve); font-weight: 700; }

/* ---------- parts ---------- */
.parts { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.part { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 10px 12px 12px 8px; border-radius: 9px; border: 1px solid transparent; }
.part.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.part.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.part .letter { font: 600 14px/2.1 var(--f-mono); color: var(--graphite); text-align: right; }
.part .body { min-width: 0; display: grid; gap: 7px; }
.part .label { line-height: 1.5; overflow-x: auto; overflow-y: hidden; }
.answer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-row input[type="text"] { flex: 1 1 220px; min-width: 0; max-width: 420px; font: 500 16px/1.3 var(--f-mono); background: var(--sheet); border: 1px solid var(--grid-strong); border-bottom: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; padding: 8px 10px; }
.answer-row input[type="text"]:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.mark { font: 700 13px/1 var(--f-mono); letter-spacing: 0.04em; padding: 5px 8px; border-radius: 999px; }
.mark.ok { color: var(--ok); border: 1.5px solid var(--ok); }
.mark.bad { color: var(--bad); border: 1.5px solid var(--bad); }
.preview { font-size: 15px; color: var(--graphite); min-height: 1.4em; overflow-x: auto; }
.preview .pv-lbl { font: 500 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.preview.err { color: var(--bad); font: 500 13px/1.4 var(--f-mono); }
.feedback { font-size: 15px; }
.feedback .reveal { font: 500 13px/1.4 var(--f-mono); color: var(--graphite); }
.choices { display: grid; gap: 6px; }
.choice { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--grid-strong); border-radius: 8px; cursor: pointer; background: var(--sheet); line-height: 1.45; }
.choice:hover { border-color: var(--ink); }
.choice input { margin: 4px 0 0; accent-color: var(--ink); }
.choice.right { border-color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.choice.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-row .choice { grid-template-columns: 18px auto; }

.keys { display: flex; flex-wrap: wrap; gap: 4px; }
.keys button { font: 500 12px/1 var(--f-mono); border: 1px solid var(--grid-strong); background: var(--paper); border-radius: 5px; padding: 6px 8px; cursor: pointer; min-width: 32px; }
.keys button:hover { border-color: var(--ink); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--sheet); padding: 9px 16px; border-radius: 8px; cursor: pointer; font: 600 14px/1.1 var(--f-display); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { border-color: var(--grid-strong); }
.score-line { font: 500 13px var(--f-mono); color: var(--graphite); margin-left: auto; }

.hint { margin-top: 14px; font-size: 15px; background: var(--paper); border-radius: 8px; padding: 10px 14px; }
.hint b { font: 600 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); margin-right: 6px; }
.solution { margin-top: 16px; border-top: 2px solid var(--ink); padding-top: 12px; }
.solution > .sol-lbl { font: 600 11px var(--f-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--curve); }
.solution h4 { margin: 12px 0 4px; font: 700 15px var(--f-display); }
.solution p { margin: 6px 0; max-width: 72ch; }
.solution mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }

/* ---------- dashboard / notes ---------- */
.intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.intro .cell h4 { margin: 0 0 4px; font: 700 16px var(--f-display); }
.intro .cell p { margin: 0; font-size: 15px; color: var(--graphite); }
.warn { font-size: 15px; background: var(--curve-soft); border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
.warn b { font-family: var(--f-display); }

.formula { display: grid; gap: 18px; }
.formula section h3 { margin: 0 0 8px; font: 700 20px var(--f-display); display: flex; gap: 10px; align-items: baseline; }
.formula section h3 .tag { font-size: 12px; }
.formula dl { margin: 0; display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 8px 18px; }
.formula dt { font: 600 12px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--graphite); }
.formula dd { margin: 0; overflow-x: auto; }

.exam-bar { position: sticky; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow); }
.exam-bar .clock { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.exam-bar .meta { font: 500 12px/1.3 var(--f-mono); letter-spacing: 0.05em; opacity: 0.85; }
.exam-bar .btn { background: var(--sheet); color: var(--ink); border-color: var(--sheet); margin-left: auto; }
.result { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
.result .big { font: 800 56px/1 var(--f-display); color: var(--curve); font-variant-numeric: tabular-nums; }
.result table { border-collapse: collapse; font: 500 13px var(--f-mono); }
.result td { padding: 3px 12px 3px 0; }

.setup { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; }
.setup label { display: inline-flex; gap: 6px; align-items: center; font: 500 13px var(--f-mono); }
.setup select { background: var(--sheet); border: 1px solid var(--grid-strong); border-radius: 6px; padding: 6px 8px; }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; display: grid; gap: 2px; padding: 10px; }
  .rail ul { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .rail li { flex: 0 0 auto; }
  .rail button { border: 1px solid var(--grid-strong); white-space: nowrap; }
  .formula dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .formula dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) { .btn:hover { transform: none; } }

/* ---------- mock exams ---------- */
.mock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.mock-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-content: start; }
.mock-card .actions { grid-column: 1 / -1; margin-top: 10px; }
.mock-letter { font: 800 64px/0.9 var(--f-display); color: var(--curve); min-width: 44px; }
.mock-card h3 { margin: 4px 0 2px; font: 700 20px/1.2 var(--f-display); }
.mock-meta, .mock-best { margin: 0; font: 500 13px/1.5 var(--f-mono); color: var(--graphite); }
.mock-best b { color: var(--ok); }

/* ---------- printable paper ---------- */
.paper-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.paper-tools .score-line { margin-left: 0; }
.paper { background: var(--sheet); color: var(--ink); border: 1px solid var(--grid-strong); border-radius: 4px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 56px); max-width: 900px; font-size: 16px; }
.paper-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; font-size: 15px; }
.paper-title { font: 600 24px/1.25 var(--f-body); }
.paper-name { display: grid; gap: 10px; min-width: 240px; }
.paper-total { font: 600 17px var(--f-body); align-self: end; }
.line { display: inline-block; width: 190px; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
.line.short { width: 60px; }
.paper-dir { margin: 14px 0 4px; font-size: 15px; max-width: none; }
.paper-q { padding-block: 18px 8px; border-bottom: 1px solid var(--grid); break-inside: avoid; }
.pq-head { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.pq-num { font-weight: 600; }
.pq-total { font: 500 12px var(--f-mono); color: var(--graphite); white-space: nowrap; padding-top: 3px; }
.pq-body p { margin: 0 0 8px; }
.pq-body mjx-container[display="true"] { margin: 8px 0 !important; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.pq-parts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.pq-parts li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; }
.pq-letter { color: var(--graphite); }
.pq-pts { font: 500 11px var(--f-mono); color: var(--faint); }
.pq-choices { display: grid; gap: 4px; margin-top: 4px; }
.blank { display: inline-block; width: min(180px, 40%); border-bottom: 1px solid var(--ink); margin-left: 8px; }
.tf { font-weight: 600; margin-right: 14px; }
.key-ans { margin-top: 3px; color: var(--ok); font-weight: 600; }
.work { margin-top: 10px; border: 1px dashed var(--grid-strong); border-radius: 4px; }
.work.short { height: 0.5in; }
.work.mid { height: 1.5in; }
.work.tall { height: 2.5in; }
.paper .figure svg.graph { max-width: 340px; }
.bare .mast, .bare .modes, .bare .rail { display: none; }
.bare .shell { display: block; max-width: 900px; }
@page { margin: 0.55in; }
@media print {
  :root:root, :root:root[data-theme] {
    --paper: #ffffff; --sheet: #ffffff; --ink: #000000; --graphite: #333333; --faint: #666666;
    --grid: #dddddd; --grid-strong: #999999; --curve: #b0281a; --ok: #1d6b3d; --shadow: none;
  }
  body { background: #fff !important; padding: 0; font-size: 12pt; }
  .mast, .modes, .rail, .paper-tools, .exam-bar { display: none !important; }
  .shell { display: block; max-width: none; padding: 0; }
  .paper { border: 0; box-shadow: none; padding: 0; max-width: none; }
  .paper-q { page-break-inside: avoid; }
}
</style>

<header class="mast">
  <div class="brand">
    <span class="sub">MAT 213 · Brief Calculus · Sections 1.1–1.4</span>
    <h1>Midterm Lab <span class="lim">lim</span></h1>
  </div>
  <div class="countdown" id="countdown" aria-live="polite"></div>
</header>
<nav class="modes" aria-label="Study mode">
  <button type="button" data-mode="practice" aria-pressed="true">Practice by topic</button>
  <button type="button" data-mode="mixed" aria-pressed="false">Mixed review</button>
  <button type="button" data-mode="exam" aria-pressed="false">Mock exams</button>

</nav>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Topics"></aside>

<script>// ================= core: random, rationals, TeX helpers, parser, answer checking =================
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  nz: (a, b) => { let v; do { v = R.int(a, b); } while (v === 0); return v; },
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle: (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sign: () => (Math.random() < 0.5 ? -1 : 1),
  chance: (p) => Math.random() < p,
  sample: (arr, n) => R.shuffle(arr).slice(0, n),
};

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }

// Exact rational numbers
class Q {
  constructor(n, d = 1) {
    if (d === 0) throw new Error("division by zero");
    if (!Number.isInteger(n) || !Number.isInteger(d)) { // allow decimals like 0.05 by scaling
      let s = 1; while ((!Number.isInteger(n * s) || !Number.isInteger(d * s)) && s < 1e9) s *= 10;
      n = Math.round(n * s); d = Math.round(d * s);
    }
    if (d < 0) { n = -n; d = -d; }

      if (L === Rr) { if (v !== L) { g.dot(nd.x, L, false); if (v != null) g.dot(nd.x, v, true); } return; }

  const SLOPES = [-1.5, -1, -0.5, 0, 0.5, 1, 1.5];

  function randomPiecewise(types, opts = {}) {
    const view = { xmin: -6, xmax: 6, ymin: -5, ymax: 5, W: 400, H: 340 };
    for (let attempt = 0; attempt < 400; attempt++) {
      const n = types.length;
      // spaced integer positions
      let xs = [];
      const gapMin = n >= 4 ? 2 : 3;
      for (let t = 0; t < 50 && xs.length < n; t++) {
        xs = [];
        let cur = -5 + R.int(0, 1);
        for (let i = 0; i < n; i++) { xs.push(cur); cur += gapMin + R.int(0, n >= 4 ? 1 : 2); }
        if (xs[n - 1] > 5) xs = [];

      if (!xs.length) continue;

      // no two asymptotes adjacent
      let bad = false;
      for (let i = 1; i < n; i++) if (ts[i] === "asym" && ts[i - 1] === "asym") bad = true;
      if (bad) continue;
      const nodes = [{ x: view.xmin - 0.6, yR: R.int(-3, 3), sR: R.pick(SLOPES) }];
      ts.forEach((t, i) => {

      });
      nodes.push({ x: view.xmax + 0.6, yL: R.int(-3, 3), sL: R.pick(SLOPES) });
      // validate ranges
      let ok = true;
      for (let i = 0; i < nodes.length - 1 && ok; i++) {
        const a = nodes[i], b = nodes[i + 1];
        if (!isFinite(a.yR) && !isFinite(b.yL)) { ok = false; break; }

var GEN = window.GEN || {}; window.GEN = GEN;

function describeNode(n, fname = "f") {
  const a = n.x, out = [];
  const val = n.value === "DNE"
    ? `There is no filled dot on the line ${$m(`x = ${a}`)}, so ${$m(`${fname}(${a})`)} is undefined → <b>DNE</b>.`
    : n.type === "continuous"
      ? `The curve passes straight through ${$m(`(${a}, ${n.value})`)}, so ${$m(`${fname}(${a}) = ${n.value}`)}.`
      : `The <b>filled</b> dot at ${$m(`x = ${a}`)} sits at height ${n.value}, so ${$m(`${fname}(${a}) = ${n.value}`)}.`;
  out.push(val);
  const side = (v, dir) => isFinite(v)
    ? `Tracing the curve toward ${$m(`x = ${a}`)} from the ${dir}, the heights approach <b>${v}</b> (open or closed dot doesn't matter).`
    : `From the ${dir}, the curve runs along the asymptote ${$m(`x = ${a}`)} ${v > 0 ? "upward" : "downward"}, so the limit is ${$m(T.ans(v))}.`;
  out.push(side(n.left, "left"), side(n.right, "right"));
  if (n.limit === "DNE") out.push(`The left and right limits don't match, so ${$m(`${T.lim(a)} ${fname}(x)`)} <b>DNE</b>.`);
  else if (!isFinite(n.limit)) out.push(`Both sides go to ${$m(T.ans(n.limit))}, so ${$m(`${T.lim(a)} ${fname}(x) = ${T.ans(n.limit)}`)} (unbounded, so no finite limit exists).`);
  else out.push(`Both one-sided limits equal ${n.limit}, so ${$m(`${T.lim(a)} ${fname}(x) = ${n.limit}`)}${n.value !== n.limit ? ` — even though ${$m(`${fname}(${a})`)} ${n.value === "DNE" ? "is undefined" : `= ${n.value}`}. The limit ignores the value AT the point.` : "."}`);
  return `<h4>At ${$m(`x = ${a}`)}</h4>` + out.map(para).join("");
}

GEN.graphRead = () => {

  const G = Graph.randomPiecewise(types);
  const pickN = R.shuffle(G.inner).sort((a, b) => (a.type === "continuous") - (b.type === "continuous")).slice(0, 2).sort((a, b) => a.x - b.x);

GEN.numTable = () => {
  const v = R.int(1, 6);
  let a, ftex, fn, L, approx = 0.0061, extra = "";
  if (v === 1) { const r = R.nz(-5, 5); a = r; ftex = tx`\frac{x^2 - ${r * r}}{${T.fac(r).slice(1, -1)}}`; fn = (x) => (x * x - r * r) / (x - r); L = q(2 * r); extra = tx`\frac{(x - ${r})(x + ${r})}{x - ${r}} = x + ${r} \to ${2 * r}`.replace(/- -/g, "+ ").replace(/\+ -/g, "- "); }
  if (v === 2) { const r = R.nz(-4, 4); let s; do { s = R.nz(-5, 5); } while (s === r); a = r; ftex = tx`\frac{${T.poly([1, -(r + s), r * s])}}{${T.fac(r).slice(1, -1)}}`; fn = (x) => (x * x - (r + s) * x + r * s) / (x - r); L = q(r - s); extra = tx`\frac{${T.fac(r)}${T.fac(s)}}{${T.fac(r)}} = ${T.fac(s).slice(1, -1)} \to ${r} ${r - s - r < 0 ? "-" : "+"} ${Math.abs(s)} = ${r - s}`; }
  if (v === 3) { const r = R.int(2, 4); a = r * r; ftex = tx`\frac{\sqrt{x} - ${r}}{x - ${r * r}}`; fn = (x) => (Math.sqrt(x) - r) / (x - r * r); L = q(1, 2 * r); extra = tx`\frac{\sqrt{x} - ${r}}{(\sqrt{x} - ${r})(\sqrt{x} + ${r})} = \frac{1}{\sqrt{x} + ${r}} \to \frac{1}{${2 * r}}`; }
  if (v === 4) { a = 0; ftex = tx`\frac{e^{x} - 1}{x}`; fn = (x) => (Math.exp(x) - 1) / x; L = q(1); extra = "(This one can't be simplified with algebra — the table is the tool.)"; }
  if (v === 5) { a = 0; ftex = tx`\frac{2^{x} - 1}{x}`; fn = (x) => (Math.pow(2, x) - 1) / x; L = Math.LN2; approx = 0.011; extra = tx`\text{(The exact value is } \ln 2 \approx 0.693\text{.)}`; }

  const table = `<div class="tbl-wrap"><table class="vt"><tr><th>${$m("x")}</th>${rows}</tr><tr><th>${$m("f(x)")}</th>${vals}</tr></table></div>`;
  const Lt = L instanceof Q ? L : L;

    prompt: para(`Let ${$m(`f(x) = ${ftex}`)}. We want to know what happens to the outputs when ${$m("x")} is near ${$m(a)}.`) + table,

GEN.inverse = () => {

GEN.endBehavior = () => {
  const makePoly = () => {
    const n = R.int(2, 5), a = R.nz(-4, 4), dir = R.sign();
    const coefs = [a]; for (let i = 0; i < n; i++) coefs.push(R.chance(0.5) ? 0 : R.int(-6, 6));
    const s = Math.sign(a) * (dir < 0 && n % 2 === 1 ? -1 : 1);
    const to = dir > 0 ? "\\infty" : "-\\infty";
    return { label: $m(`${T.lim(to)} \\left(${T.poly(coefs)}\\right)`), ans: s * Infinity,
      why: `Leading term ${$m(T.poly([a, ...Array(n).fill(0)]))}: degree ${n} (${n % 2 ? "odd" : "even"}), leading coefficient ${a > 0 ? "positive" : "negative"}. As ${$m(`x \\to ${to}`)}, ${$m(`x^{${n}}`)} ${n % 2 === 0 ? "is positive" : dir > 0 ? "is positive" : "is negative"}, times ${a} → ${$m(T.ans(s * Infinity))}.` };
  };

GEN.bigPiecewise = () => {

function divByPower(coefs, m) {
  const n = coefs.length - 1; let out = "";
  coefs.forEach((c, i) => {
    const k = n - i; if (c === 0) return;
    const neg = c < 0, a = Math.abs(c); let body;
    if (k > m) body = (a === 1 ? "" : a) + (k - m === 1 ? "x" : `x^{${k - m}}`);
    else if (k === m) body = String(a);
    else body = `\\frac{${a}}{${m - k === 1 ? "x" : `x^{${m - k}}`}}`;
    out += out === "" ? (neg ? "-" : "") + body : (neg ? " - " : " + ") + body;
  });
  return out;
}

GEN.infRational = () => {
  const cases = R.shuffle(["eq", "lt", "gt"]);

    let n, m;
    if (cs === "eq") { n = m = R.int(1, 4); }
    if (cs === "lt") { m = R.int(2, 4); n = R.int(0, m - 1); }
    if (cs === "gt") { m = R.int(1, 3); n = m + R.int(1, 2); }
    const a = R.nz(-7, 7), b = R.nz(-7, 7), dir = R.sign();
    const num = [a], den = [b];
    for (let i = 0; i < n; i++) num.push(R.chance(0.45) ? 0 : R.int(-9, 9));
    for (let i = 0; i < m; i++) den.push(R.chance(0.45) ? 0 : R.int(-9, 9));
    const to = dir > 0 ? "\\infty" : "-\\infty";
    let ans;
    if (n === m) ans = q(a, b);
    else if (n < m) ans = q(0);
    else ans = Math.sign(a * b) * (dir < 0 && (n - m) % 2 === 1 ? -1 : 1) * Infinity;
    const t = `${T.lim(to)} \\frac{${T.poly(num)}}{${T.poly(den)}}`;
    const powTxt = m === 1 ? "x" : `x^{${m}}`;
    let concl;
    if (n === m) concl = `Every fraction term → 0, leaving ${$m(`\\frac{${a}}{${b}} = ${q(a, b).tex()}`)}.`;
    else if (n < m) concl = `The top → 0 while the bottom → ${b}, so the limit is ${$m("0")}.`;
    else concl = `The bottom → ${b}, but the top is dominated by ${$m(`${a}x^{${n - m}}`)}, which → ${$m(T.ans(Math.sign(a) * (dir < 0 && (n - m) % 2 === 1 ? -1 : 1) * Infinity))} as ${$m(`x \\to ${to}`)}; dividing by ${b} gives ${$m(T.ans(ans))}.`;
    return { t, ans, sol: `Divide every term by ${$m(powTxt)}, the highest power of ${$m("x")} in the denominator:` + $M(`${t} = ${T.lim(to)} \\frac{${divByPower(num, m)}}{${divByPower(den, m)}}`) + concl };
  });

      $M(`${c}k ${b < 0 ? "-" : "+"} ${Math.abs(b)} = ${leftV} \\;\\Rightarrow\\; k = \\frac{${leftV - b}}{${c}} = ${k.tex()}`),

const DISC = ["Continuous", "Removable discontinuity", "Jump discontinuity", "Infinite discontinuity"];
GEN.discType = () => {
  if (R.chance(0.45)) {
    const G = Graph.randomPiecewise(R.shuffle(["jump", "hole", "asym", "cont"]));
    const idx = { continuous: 0, removable: 1, jump: 2, infinite: 3 };
    return {
      prompt: para(`Classify the behavior of ${$m("f")} at each labeled ${$m("x")}-value.`),
      figure: G.svg,
      parts: G.inner.map((n) => P.mcFixed(`At ${$m(`x = ${n.x}`)}`, DISC, idx[n.type])),
      hint: "Removable = a hole (the limit exists). Jump = the two sides land at different heights. Infinite = a vertical asymptote.",
      solution: G.inner.map((n) => para(`<b>${$m(`x = ${n.x}`)}:</b> ${{
        continuous: `No break, and the dot is on the curve → continuous.`,
        removable: `Both sides approach ${n.left}, but ${n.value === "DNE" ? "there is no point there" : `the filled dot is at ${n.value}`} → removable (the limit exists, it just doesn't match f).`,
        jump: `Left approaches ${n.left}, right approaches ${n.right} → jump.`,
        infinite: `The graph shoots off along a vertical asymptote → infinite.`,
      }[n.type]}`)).join(""),
    };
  }
  const pool = [
    () => { const r = R.nz(-5, 5); return { t: `f(x) = \\frac{x^2 - ${r * r}}{${T.fac(r).slice(1, -1)}} \\text{ at } x = ${r}`, a: 1, s: `0/0 at ${r}, but it cancels to ${$m(T.fac(-r).slice(1, -1))}, so the limit exists (${2 * r}) while ${$m(`f(${r})`)} is undefined → removable.` }; },
    () => { const c = R.nz(-5, 5); let s; do { s = R.int(-5, 5); } while (s === -c); return { t: `f(x) = \\frac{${T.poly([1, s])}}{${T.fac(c).slice(1, -1)}} \\text{ at } x = ${c}`, a: 3, s: `The bottom is 0 at ${c} but the top is ${c + s} ≠ 0 → vertical asymptote → infinite.` }; },
    () => { const c = R.int(-3, 3), p = R.int(-4, 4), j = R.pick([-3, -2, 2, 3]); return { t: `f(x) = \\begin{cases} ${T.poly([1, p])} & x < ${c} \\\\ ${T.poly([1, p + j])} & x \\ge ${c} \\end{cases} \\text{ at } x = ${c}`, a: 2, s: `Left → ${c + p}, right → ${c + p + j}. Different finite values → jump.` }; },
    () => { const a = R.int(-4, 4), co = [R.nz(-3, 3), R.int(-5, 5), R.int(-5, 5)]; return { t: `f(x) = ${T.poly(co)} \\text{ at } x = ${a}`, a: 0, s: `Polynomials are continuous everywhere.` }; },
    () => { const c = R.nz(-3, 3); let d; do { d = R.nz(-4, 4); } while (d === c); return { t: `f(x) = \\frac{${T.fac(c).slice(1, -1)}}{${T.poly([1, -(c + d), c * d])}} \\text{ at } x = ${d}`, a: 3, s: `Factor: ${$m(`\\frac{${T.fac(c)}}{${T.fac(c)}${T.fac(d)}}`)}. The ${$m(T.fac(d))} factor does NOT cancel, so ${$m(`x = ${d}`)} is a vertical asymptote → infinite.` }; },
    () => { const c = R.nz(-3, 3); let d; do { d = R.nz(-4, 4); } while (d === c); return { t: `f(x) = \\frac{${T.fac(c).slice(1, -1)}}{${T.poly([1, -(c + d), c * d])}} \\text{ at } x = ${c}`, a: 1, s: `Factor: ${$m(`\\frac{${T.fac(c)}}{${T.fac(c)}${T.fac(d)}}`)}. The ${$m(T.fac(c))} cancels, leaving ${$m(`\\frac{1}{${T.fac(d).slice(1, -1)}} \\to ${q(1, c - d).tex()}`)} → removable.` }; },
  ];
  const items = R.sample(pool, 3).map((f) => f());
  return {
    prompt: para(`Classify each function at the given ${$m("x")}-value.`),
    parts: items.map((it) => P.mcFixed($m(it.t), DISC, it.a)),
    hint: "Factor first. A factor that cancels means a hole (removable); one that stays in the bottom means an asymptote (infinite).",
    solution: items.map((it, i) => para(`<b>${"abc"[i]}.</b> ${it.s}`)).join(""),
  };
};

const sumTex = (items) => {
  let out = "";
  items.forEach(([c, body]) => {
    c = Q.of(c); if (c.isZero()) return;
    const neg = c.n < 0, a = neg ? c.neg() : c;
    const s = (body && a.eq(1) ? "" : a.tex()) + body;
    out += out === "" ? (neg ? "-" : "") + s : (neg ? " - " : " + ") + s;
  });
  return out || "0";
};
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

GEN.arcFunc = () => {

  do {

    parts: [

        `At exactly ${$m(`${v} = ${qq}`)} ${ctx.inU}, ${ctx.what} is changing at a rate of ${$m(Vt)} ${ctx.unit}.`,

GEN.dq = () => {
  const v = R.pick(["Q", "Q", "Q", "R", "R", "C"]);
  const hs = v === "R" ? [1, 0.5, 0.05] : [1, 0.1, 0.01];
  let ftex, expr, fn, disp, steps, x0, at, extra = {}, lim;
  if (v === "Q") {
    const a = R.pick([1, -1, 2, -2, 3]), b = R.int(-6, 6), c = R.int(-5, 5);
    ftex = T.poly([a, b, c]); x0 = R.int(-3, 3);
    fn = (e) => 2 * a * e.x + a * e.h + b;
    disp = sumTex([[2 * a, "x"], [a, "h"], [b, ""]]);
    at = (h) => q(2 * a * x0 + b).add(q(h).mul(a));
    lim = q(2 * a * x0 + b);
    extra = { simplifyH: true };
    steps =
      $M(`f(x + h) = ${sumTex([[a, "(x + h)^2"], [b, "(x + h)"], [c, ""]])} = ${sumTex([[a, "x^2"], [2 * a, "xh"], [a, "h^2"], [b, "x"], [b, "h"], [c, ""]])}`) +
      $M(`f(x + h) - f(x) = ${sumTex([[2 * a, "xh"], [a, "h^2"], [b, "h"]])}`) +
      $M(`\\frac{f(x + h) - f(x)}{h} = \\frac{h\\left(${disp}\\right)}{h} = ${disp}`);
  } else if (v === "R") {
    const k = R.pick([1, 2, 3, 4, -2]);
    ftex = `\\frac{${k}}{x}`; x0 = R.pick([1, 2]);
    fn = (e) => -k / (e.x * (e.x + e.h));
    disp = `\\frac{${-k}}{x(x + h)}`;
    at = (h) => q(-k).div(q(x0).mul(q(x0).add(q(h))));
    lim = q(-k, x0 * x0);
    extra = { avoid: (e) => Math.abs(e.x) < 0.3 || Math.abs(e.x + e.h) < 0.3 };
    steps =
      $M(`\\frac{f(x + h) - f(x)}{h} = \\frac{\\frac{${k}}{x + h} - \\frac{${k}}{x}}{h} = \\frac{\\frac{${k}x - ${k}(x + h)}{x(x + h)}}{h}`) +
      $M(`= \\frac{${-k}h}{x(x + h)} \\cdot \\frac{1}{h} = ${disp}`);
  } else {
    const b = R.int(-5, 5);
    ftex = T.poly([1, 0, b, 0]); x0 = R.pick([1, -1, 2]);
    fn = (e) => 3 * e.x * e.x + 3 * e.x * e.h + e.h * e.h + b;
    disp = sumTex([[3, "x^2"], [3, "xh"], [1, "h^2"], [b, ""]]);
    at = (h) => { const H = q(h); return q(3 * x0 * x0 + b).add(H.mul(3 * x0)).add(H.mul(H)); };
    lim = q(3 * x0 * x0 + b);
    extra = { simplifyH: true };
    steps =
      $M(`f(x + h) = (x + h)^3 ${b ? T.sgn(b).replace(/ (\d+)$/, " $1") + "(x + h)" : ""} = x^3 + 3x^2h + 3xh^2 + h^3 ${b ? `${b < 0 ? "-" : "+"} ${Math.abs(b)}x ${b < 0 ? "-" : "+"} ${Math.abs(b)}h` : ""}`) +
      $M(`\\frac{f(x + h) - f(x)}{h} = \\frac{3x^2h + 3xh^2 + h^3 ${b ? `${b < 0 ? "-" : "+"} ${Math.abs(b)}h` : ""}}{h} = ${disp}`);
  }
  const table = hs.map((h) => [x0, h, at(h)]);
  return {
    prompt: para(`Let ${$m(`f(x) = ${ftex}`)}. Find and simplify the difference quotient ${$m("\\frac{f(x + h) - f(x)}{h}")}, then use it to fill in the table.`),
    parts: [
      P.expr(`Simplified difference quotient (in terms of ${$m("x")} and ${$m("h")})`, fn, disp, { vars: ["x", "h"], ...extra }),
      ...table.map(([x, h, val]) => P.num(`${$m(`x = ${x},\\ h = ${fmtDec(h, 2)}`)}`, val)),
      P.num(`As ${$m("h \\to 0")}, what value do these approach?`, lim),
    ],
    hint: "Expand f(x + h) carefully (every x becomes (x + h)), subtract f(x), then factor h out of the top and cancel.",
    solution: steps + para(`Now substitute:`) + table.map(([x, h, val]) => $M(`x = ${x},\\ h = ${fmtDec(h, 2)}: \\quad ${val.tex()}${val.isInt() ? "" : ` = ${fmtDec(val.val(), 4)}`}`)).join("") +
      para(`Letting ${$m("h \\to 0")} leaves ${$m(lim.tex())}: the instantaneous rate of change (slope of the tangent line) at ${$m(`x = ${x0}`)}. That's exactly what section 1.4 formalizes.`),
  };
};

// ================= Section 1.4 — The limit definition of the derivative =================
const LH = `\\lim_{h \\to 0}`;
const noH = [{ v: "h", msg: "Your answer still contains h — take the limit as h → 0 (let h become 0 after cancelling)." }];

function derivSteps(kind, d) {
  if (kind === "quad") {
    const { a, b, c } = d;
    return $M(`f'(x) = ${LH} \\frac{f(x + h) - f(x)}{h} = ${LH} \\frac{\\left[${sumTex([[a, "(x + h)^2"], [b, "(x + h)"], [c, ""]])}\\right] - \\left(${T.poly([a, b, c])}\\right)}{h}`) +
      $M(`= ${LH} \\frac{${sumTex([[a, "x^2"], [2 * a, "xh"], [a, "h^2"], [b, "x"], [b, "h"], [c, ""]])} ${sumTex([[-a, "x^2"], [-b, "x"], [-c, ""]]).replace(/^(?!-)/, "+ ").replace(/^-/, "- ")}}{h}`) +
      $M(`= ${LH} \\frac{${sumTex([[2 * a, "xh"], [a, "h^2"], [b, "h"]])}}{h} = ${LH} \\frac{h\\left(${sumTex([[2 * a, "x"], [a, "h"], [b, ""]])}\\right)}{h}`) +
      $M(`= ${LH} \\left(${sumTex([[2 * a, "x"], [a, "h"], [b, ""]])}\\right) = ${sumTex([[2 * a, "x"], [b, ""]])}`);
  }
  if (kind === "recip") {
    const { k } = d;
    return $M(`f'(x) = ${LH} \\frac{\\frac{${k}}{x + h} - \\frac{${k}}{x}}{h} = ${LH} \\frac{\\frac{${k}x - ${k}(x + h)}{x(x + h)}}{h}`) +
      $M(`= ${LH} \\frac{${-k}h}{x(x + h)} \\cdot \\frac{1}{h} = ${LH} \\frac{${-k}}{x(x + h)} = \\frac{${-k}}{x^2}`);
  }
  if (kind === "sqrt") {
    return $M(`f'(x) = ${LH} \\frac{\\sqrt{x + h} - \\sqrt{x}}{h} \\cdot \\frac{\\sqrt{x + h} + \\sqrt{x}}{\\sqrt{x + h} + \\sqrt{x}} = ${LH} \\frac{(x + h) - x}{h\\left(\\sqrt{x + h} + \\sqrt{x}\\right)}`) +
      $M(`= ${LH} \\frac{1}{\\sqrt{x + h} + \\sqrt{x}} = \\frac{1}{2\\sqrt{x}}`);
  }
  const { b } = d;
  const bx = b ? ` ${b < 0 ? "-" : "+"} ${Math.abs(b)}` : "";
  return $M(`f'(x) = ${LH} \\frac{\\left[(x + h)^3${b ? `${bx}(x + h)` : ""}\\right] - \\left(${T.poly([1, 0, b, 0])}\\right)}{h}`) +

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function withSeed(seed, fn) {
  const orig = Math.random; Math.random = mulberry32(seed);
  try { return fn(); } finally { Math.random = orig; }
}

function partPoints(parts, part) {
  if (part.type === "expr" || part.type === "line") return 3;
  if (part.type === "mc") return 1;
  return parts.filter((p) => p.type === "num").length >= 4 ? 1 : 2;

function runMock(mock, minutes) {
  clearInterval(examTimer);
  const main = document.getElementById("main"); main.innerHTML = "";
  const problems = buildMock(mock), totalPts = problems.reduce((n, p) => n + p.total, 0);
  const bar = el("div", { class: "exam-bar" });

  const submit = btn("Submit exam", "", () => grade(false));
  bar.append(submit); main.append(bar);
  const views = problems.map((p, i) => {
    const t = TOPIC_BY_ID[p.id];
    const v = problemCard(p.pr, { title: t.name, tag: `§${t.sec} · ${p.total} pts`, num: i + 1 });
    main.append(v.card);
    return { ...p, ...v };
  });
  typeset(main);
  window.scrollTo({ top: 0 });
  const end = Date.now() + minutes * 60000;
  if (minutes) {
    examTimer = setInterval(() => {
      const left = Math.max(0, end - Date.now()), m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      const clock = document.getElementById("clock"); if (clock) clock.textContent = `${m}:${String(s).padStart(2, "0")}`;
      if (left <= 0) grade(true);
    }, 1000);
  }
  let done = false;
  function grade(timeUp) {
    if (done) return; done = true; clearInterval(examTimer);
    const bySec = {}; let earned = 0;
    views.forEach((v) => {
      const sec = TOPIC_BY_ID[v.id].sec; bySec[sec] = bySec[sec] || [0, 0];
      v.ctrls.forEach((c, j) => { const r = c.grade(); applyResult(c, r, true); c.lock(); if (r.ok) { earned += v.pts[j]; bySec[sec][0] += v.pts[j]; } bySec[sec][1] += v.pts[j]; });
      v.card.append(el("details", { class: "solution" }, `<summary class="sol-lbl" style="cursor:pointer">Worked solution</summary>${v.pr.solution}`));
    });
    const pct = Math.round((100 * earned) / totalPts);
    if (mock.key) { state.mockScores[mock.key] = Math.max(state.mockScores[mock.key] ?? 0, pct); persist(); }
    const weakest = Object.entries(bySec).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])[0];
    const res = el("section", { class: "sheet" });
    res.innerHTML = `<div class="sheet-head"><h3>${timeUp ? "Time's up — " : ""}${mock.name} results</h3><span class="tag">graded</span></div>
      <div class="result"><span class="big">${pct}%</span><span>${earned} of ${totalPts} points</span>
      <table>${Object.entries(bySec).map(([s, [a, b]]) => `<tr><td>§${s}</td><td>${a}/${b} pts</td><td>${Math.round((100 * a) / b)}%</td></tr>`).join("")}</table></div>
      <p class="prompt" style="margin-top:10px">Your weakest section was <b>§${weakest[0]}</b>. Missed answers below show the correct value, and every problem has a worked solution. Drill §${weakest[0]} from the topic list, then retake this exam or move to the next one.</p>`;
    const acts = el("div", { class: "actions" });
    acts.append(btn("Back to mock exams", "primary", renderMocks));
    if (mock.key) acts.append(btn("Printable answer key", "", () => renderPaper(mock, true)));
    res.append(acts);
    bar.remove(); main.prepend(res); typeset(main);
    window.scrollTo({ top: 0, behavior: smooth() });
  }
}

    p.pr.parts.forEach((part, j) => {
      const letter = p.pr.parts.length > 1 ? `${String.fromCharCode(97 + j)}.)` : "";
      const tf = part.type === "mc" && part.choices.length === 2 && part.choices[0] === "True";
      let inner;
      if (withKey) {
        const ans = part.type === "mc" ? (tf ? part.choices[part.ans] : `(${L[part.ans]}) ${part.choices[part.ans]}`) : $m(part.type === "num" ? T.ans(part.ans) : part.display);
        inner = `<span class="pl">${part.label}</span><div class="key-ans">${ans}</div>`;
      } else if (tf) inner = `<span class="tf">T&nbsp;&nbsp;&nbsp;F</span><span class="pl">${part.label}</span>`;
      else if (part.type === "mc") inner = `<span class="pl">${part.label}</span><div class="pq-choices">${part.choices.map((c, k) => `<div>(${L[k]}) ${c}</div>`).join("")}</div>`;
      else inner = `<span class="pl">${part.label}</span><span class="blank"></span>`;
      html += `<li><span class="pq-letter">${letter}</span><div>${inner}</div><span class="pq-pts">(${p.pts[j]})</span></li>`;
    });
    html += `</ol></div><span class="pq-total">${p.total} pts</span></div>`;
    html += withKey ? `<div class="solution"><div class="sol-lbl">Worked solution</div>${p.pr.solution}</div>` : `<div class="work ${WORK[p.id] || "short"}" aria-hidden="true"></div>`;
    html += `</section>`;
  });
  main.append(el("article", { class: `paper${withKey ? " key" : ""}` }, html));
  typeset(main).then(() => document.documentElement.setAttribute("data-typeset", "done"));
  if (!bare) window.scrollTo({ top: 0 });
}

function bootFromURL() {
  const qs = new URLSearchParams(location.search), k = (qs.get("paper") || "").toUpperCase();
  const mock = MOCKS.find((m) => m.key === k);
  if (!mock) return false;
  document.body.classList.add("bare");
  renderPaper(mock, qs.get("key") === "1", true);
  return true;
}

const TOPICS = [
  { sec: "1.1", name: "Limits: numerical & graphical", items: [["graphRead", "Limits from a graph"], ["numTable", "Estimating from a table"], ["inverse", "Infinite limits"], ["endBehavior", "End behavior at ±∞"], ["bigPiecewise", "Piecewise: the big example"], ["concepts11", "Concept check"]] },
  { sec: "1.2", name: "Algebraic limits & continuity", items: [["properties", "Properties of limits"], ["directSub", "Direct substitution"], ["factor", "0/0 — factor, cancel, conjugate"], ["infRational", "Rational limits at ±∞"], ["pwLimit", "Piecewise limits"], ["continuity", "Continuity at a point"], ["discType", "Types of discontinuity"], ["concepts12", "Concept check"]] },
  { sec: "1.3", name: "Average rate of change", items: [["arcFunc", "Average rate, with units"], ["arcData", "Rates from tables & graphs"], ["arcShrink", "Shrinking intervals"], ["dq", "Difference quotient"], ["concepts13", "Concept check"]] },
  { sec: "1.4", name: "The derivative", items: [["deriv", "f′(x) by the limit definition"], ["tangent", "Tangent lines"], ["interp", "Interpreting f′(a)"], ["diffGraph", "Continuous vs. differentiable"], ["rateGraph", "Rates from a graph (T/F)"], ["concepts14", "Concept check"]] },
];
const TOPIC_BY_ID = {};
TOPICS.forEach((s) => s.items.forEach(([id, name]) => { TOPIC_BY_ID[id] = { id, name, sec: s.sec }; }));
const EXAM_DATE = new Date(2026, 8, 16);
const KEY = "mat213-midterm-lab-v1";
const smooth = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");

const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } },
  save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const state = Object.assign({ mode: "practice", topic: "graphRead", progress: {}, mockScores: {} }, store.load());
if (!GEN[state.topic]) state.topic = "graphRead";
const persist = () => store.save({ mode: state.mode, topic: state.topic, progress: state.progress, mockScores: state.mockScores });
let examTimer = null, uidCounter = 0;

function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if (html != null) e.innerHTML = html;
  return e;
}
function typeset(node) {
  const MJ = window.MathJax;
  if (MJ && MJ.typesetPromise) { if (MJ.typesetClear) MJ.typesetClear([node]); return MJ.typesetPromise([node]).catch(() => {}); }
  return Promise.resolve();
}
function makeProblem(id) {
  for (let i = 0; i < 6; i++) { try { return GEN[id](); } catch (e) { console.warn(id, e); } }
  throw new Error("Could not generate " + id);
}
function insertAt(input, text) {
  const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, s) + text + input.value.slice(e);
  const pos = s + text.length; input.setSelectionRange(pos, pos);
}

// ---------- countdown & rail ----------
function renderCountdown() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((EXAM_DATE - today) / 86400000);
  const [num, lbl] = days > 1 ? [days, "days to go"] : days === 1 ? [1, "day — it's tomorrow"] : days === 0 ? ["0", "exam day — you've got this"] : ["✓", "exam finished"];
  document.getElementById("countdown").innerHTML = `<span class="num">${num}</span><span class="lbl"><b>Midterm · Wed, Sep 16</b>${lbl}</span>`;
}
function renderRail() {
  const rail = document.getElementById("rail"); rail.innerHTML = "";
  TOPICS.forEach((s) => {
    rail.append(el("h2", {}, `<span>§${s.sec}</span><span>${s.name}</span>`));
    const ul = el("ul");
    s.items.forEach(([id, name]) => {
      const solved = state.progress[id]?.solved || 0;
      const pips = [0, 1, 2].map((i) => `<i class="${i < solved ? "on" : ""}"></i>`).join("");
      const b = el("button", {
        type: "button", "aria-current": state.mode === "practice" && state.topic === id ? "true" : "false",
        onclick: () => { state.mode = "practice"; state.topic = id; persist(); render(); window.scrollTo({ top: 0, behavior: smooth() }); },
      }, `<span>${name}</span><span class="pips" aria-label="${solved} solved">${pips}</span>`);
      const li = el("li"); li.append(b); ul.append(li);
    });
    rail.append(ul);
  });
  rail.append(el("p", { class: "legend" }, "A dot fills each time you solve a problem fully without opening the solution."));

// ---------- problem card ----------
function partView(part, i, n) {
  const id = "p" + ++uidCounter;
  const li = el("li", { class: "part" });
  li.append(el("div", { class: "letter" }, n > 1 ? String.fromCharCode(97 + i) + "." : ""));
  const body = el("div", { class: "body" }); li.append(body);
  body.append(el("div", { class: "label", id: id + "-l" }, part.label));
  const feedback = el("div", { class: "feedback", "aria-live": "polite" });
  let api;
  if (part.type === "mc") {
    const tf = part.choices.length === 2 && part.choices[0] === "True";
    const wrap = el("div", { class: tf ? "choice-row" : "choices", role: "radiogroup", "aria-labelledby": id + "-l" });
    const inputs = part.choices.map((c, j) => {
      const lab = el("label", { class: "choice" });
      const inp = el("input", { type: "radio", name: id, id: `${id}-${j}`, value: String(j) });
      inp.addEventListener("change", () => { li.classList.remove("ok", "bad"); inputs.forEach((o) => o.lab.classList.remove("wrong")); });
      lab.append(inp, el("span", {}, c)); wrap.append(lab);
      return { inp, lab };
    });
    body.append(wrap, feedback);
    api = {
      value: () => inputs.findIndex((o) => o.inp.checked),
      grade() { const k = this.value(); return k < 0 ? { empty: true } : { ok: k === part.ans }; },
      mark(res, reveal) { const k = this.value(); inputs.forEach((o, j) => { o.lab.classList.toggle("right", !!reveal && j === part.ans); o.lab.classList.toggle("wrong", !!res && res.ok === false && j === k); }); },
      lock() { inputs.forEach((o) => { o.inp.disabled = true; }); },
      answerText: () => part.choices[part.ans],
    };
  } else {
    const row = el("div", { class: "answer-row" });
    const input = el("input", {
      type: "text", id, autocomplete: "off", autocapitalize: "off", spellcheck: "false", inputmode: "text", "aria-labelledby": id + "-l",
      placeholder: part.type === "line" ? "y = …" : part.type === "expr" ? `in terms of ${(part.vars || ["x"]).join(" and ")}` : "number, inf, -inf, or DNE",
    });
    const mark = el("span", { class: "mark", hidden: "" });
    row.append(input, mark);
    const keys = el("div", { class: "keys", "aria-label": "insert symbols" });
    const keyset = part.type === "num" ? ["DNE", "inf", "-inf", "/", "sqrt(", "^"]
      : part.type === "expr" ? ["^", "/", "(", ")", "sqrt(", ...(part.vars || ["x"])]
        : ["y = ", "x", "^", "/", "(", ")"];
    keyset.forEach((k) => keys.append(el("button", { type: "button", tabindex: "-1", onclick: () => { insertAt(input, k); input.dispatchEvent(new Event("input")); input.focus(); } },
      k === "inf" ? "∞" : k === "-inf" ? "−∞" : k === "sqrt(" ? "√(" : k.trim())));
    const preview = el("div", { class: "preview" });
    body.append(row, keys, preview, feedback);
    let timer;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => updatePreview(input.value, part.type, preview), 220);
      li.classList.remove("ok", "bad"); mark.hidden = true; feedback.innerHTML = "";
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); input.closest(".sheet")?.querySelector("[data-check]")?.click(); } });
    api = {
      value: () => input.value,
      grade: () => Check[part.type](input.value, part),
      mark(res) {
        if (!res || res.empty || !("ok" in res)) { mark.hidden = true; return; }
        mark.hidden = false; mark.className = "mark " + (res.ok ? "ok" : "bad"); mark.textContent = res.ok ? "✓ correct" : "✗ not yet";
      },
      lock() { input.disabled = true; keys.remove(); },
      answerText: () => $m(part.type === "num" ? T.ans(part.ans) : part.display),
    };
  }
  Object.assign(api, { li, feedback, part });
  return { li, api };
}
function updatePreview(raw, type, box) {
  if (!raw.trim()) { box.innerHTML = ""; return; }
  const tex = Check.preview(raw, type);
  box.innerHTML = tex == null ? `<span class="pv-lbl">reads as</span>…keep typing` : `<span class="pv-lbl">reads as</span>\\(${tex}\\)`;
  if (tex != null) typeset(box);
}
function applyResult(api, res, reveal) {
  api.li.classList.remove("ok", "bad");
  let fb = "";
  if (res.empty) fb = reveal ? "" : `<span class="reveal">No answer yet.</span>`;
  else if (res.err && !("ok" in res)) fb = `<span class="preview err">${res.err}</span>`;
  else {
    api.li.classList.add(res.ok ? "ok" : "bad");
    if (res.err) fb += `<span class="preview err">${res.err}</span>`;
    if (res.note) fb += `<div>${res.note}</div>`;
  }
  if (reveal && !res.ok) fb += `<div class="reveal">Answer: ${api.answerText()}</div>`;
  api.feedback.innerHTML = fb;
  api.mark(res, reveal);
}
function problemCard(pr, { title, tag, num }) {
  const card = el("article", { class: "sheet" });
  card.append(el("div", { class: "sheet-head" }, `<h3>${num ? `<span class="qnum">${num}.</span>` : ""}${title}</h3><span class="tag">${tag}</span>`));
  card.append(el("div", { class: "prompt" }, pr.prompt));
  if (pr.figure) card.append(el("div", { class: "figure" }, pr.figure));
  const list = el("ol", { class: "parts" });
  const ctrls = pr.parts.map((part, i) => { const { li, api } = partView(part, i, pr.parts.length); list.append(li); return api; });
  card.append(list);
  return { card, ctrls };
}

function renderPractice(mixed) {
  const main = document.getElementById("main"); main.innerHTML = "";
  if (!mixed) main.append(tipsCard());
  const id = mixed ? R.pick(Object.keys(TOPIC_BY_ID)) : state.topic;
  const t = TOPIC_BY_ID[id], pr = makeProblem(id);
  const { card, ctrls } = problemCard(pr, { title: t.name, tag: `§${t.sec}${mixed ? " · mixed review" : ""}` });
  const btnCheck = el("button", { class: "btn primary", type: "button", "data-check": "" }, "Check answers");
  const btnHint = el("button", { class: "btn ghost", type: "button" }, "Hint");
  const btnSol = el("button", { class: "btn", type: "button" }, "Show solution");
  const btnNext = el("button", { class: "btn", type: "button" }, mixed ? "Next random problem →" : "New problem →");
  const score = el("span", { class: "score-line", "aria-live": "polite" });
  const actions = el("div", { class: "actions" }); actions.append(btnCheck, btnHint, btnSol, btnNext, score);
  const hintBox = el("div", { class: "hint", hidden: "" }, `<b>Hint</b>${pr.hint}`);
  const solBox = el("div", { class: "solution", hidden: "" }, `<div class="sol-lbl">Worked solution</div>${pr.solution}`);
  card.append(actions, hintBox, solBox);
  let tried = false, counted = false;
  btnCheck.onclick = () => {
    const results = ctrls.map((c) => { const r = c.grade(); applyResult(c, r, !solBox.hidden); return r; });
    const right = results.filter((r) => r.ok).length, total = results.length;
    const p = state.progress[id] || (state.progress[id] = { tries: 0, solved: 0 });
    if (!tried) { p.tries++; tried = true; }
    if (right === total && !counted && solBox.hidden) { p.solved++; counted = true; }
    score.textContent = right === total ? `All ${total} correct${solBox.hidden ? "" : " (solution was open)"}` : `${right} of ${total} correct`;
    persist(); renderRail(); typeset(card);
  };
  btnHint.onclick = () => { hintBox.hidden = !hintBox.hidden; };
  btnSol.onclick = () => { solBox.hidden = false; ctrls.forEach((c) => applyResult(c, c.grade(), true)); typeset(card); solBox.scrollIntoView({ behavior: smooth(), block: "start" }); };
  btnNext.onclick = () => { renderPractice(mixed); window.scrollTo({ top: 0, behavior: smooth() }); };
  main.append(card);
  typeset(main);
}
