    () => { const a = R.nz(-5, 5); return { t: `-x^2 \\text{ at } x = ${a}`, a: q(-a * a), s: `-(${a})^2 = -(${a * a}) = ${-a * a}` }; },
    () => { const k = R.int(2, 7); return R.chance(0.5)
      ? { t: `-${k}^2`, a: q(-k * k), s: `-${k}^2 = -(${k} \\cdot ${k}) = ${-k * k} \\quad \\text{(square first, then the negative)}` }
      : { t: `(-${k})^2`, a: q(k * k), s: `(-${k})^2 = (-${k})(-${k}) = ${k * k}` }; },
    () => {
      const co = [-R.pick([1, 2]), R.nz(-5, 5), R.int(2, 9)], a = R.nz(-3, 3), v = evalPoly(co, a);
      const sub = co.map((c, i) => ({ c, deg: 2 - i })).reverse().map((o, i) => {
        const neg = o.c < 0, abs = Math.abs(o.c), body = o.deg === 0 ? `${abs}` : `${abs === 1 ? "" : abs}(${a})${o.deg === 2 ? "^2" : ""}`;
        return (i === 0 ? (neg ? "-" : "") : neg ? " - " : " + ") + body;
      }).join("");
      return { t: `${T.poly(co, "x", true)} \\text{ at } x = ${a}`, a: v, s: `${sub} = ${v.tex()}` };
    },
    () => { const a = R.int(-9, 9), b = R.nz(-9, 9); return { t: `${a} - (${b})`, a: q(a - b), s: `${a} - (${b}) = ${a} ${b < 0 ? "+" : "-"} ${Math.abs(b)} = ${a - b}` }; },
    () => { const p = R.nz(-4, 4), r = R.nz(-6, 6), a = R.nz(-3, 3), inner = p * a + r; return { t: `-(${T.poly([p, r])}) \\text{ at } x = ${a}`, a: q(-inner), s: `-\\left(${p}(${a}) ${r < 0 ? "-" : "+"} ${Math.abs(r)}\\right) = -(${inner}) = ${-inner}` }; },
    () => { const u = R.int(-9, 9), v = R.nz(-9, 9), w = R.int(-5, 5); let z; do { z = R.int(-5, 5); } while (z === w); return { t: `\\frac{${u} - (${v})}{${w} - (${z})}`, a: q(u - v, w - z), s: `\\frac{${u} - (${v})}{${w} - (${z})} = \\frac{${u - v}}{${w - z}} = ${q(u - v, w - z).tex()}` }; },
  ];
  const items = R.sample(pool, 4).map((f) => f());
  return {
    prompt: para(`Evaluate or simplify. These sign slips are what cost points on limit and derivative problems.`),
    parts: items.map((it) => PP.num($m(`${it.t} =`), it.a)),
    hint: "Put every substituted number in parentheses. −3² means −(3²) = −9, but (−3)² = 9. Subtracting a negative is adding.",
    solution: items.map((it, i) => para(`<b>${"abcd"[i]}.</b> ${$m(it.s)}`)).join(""),
  };
};

PGEN.algExpand = () => {
  const a = R.pick([1, 2, 3, -1, -2]), b = R.int(-6, 6), c = R.int(-6, 6);
  const full = sumTex([[a, "x^2"], [2 * a, "xh"], [a, "h^2"], [b, "x"], [b, "h"], [c, ""]]);
  const pool = [
    () => ({ label: $m("(x + h)^2 ="), fn: (e) => (e.x + e.h) ** 2, display: "x^2 + 2xh + h^2", s: `(x + h)(x + h) = x^2 + xh + xh + h^2 = x^2 + 2xh + h^2` }),
    () => ({ label: $m("(x + h)^3 ="), fn: (e) => (e.x + e.h) ** 3, display: "x^3 + 3x^2h + 3xh^2 + h^3", s: `(x^2 + 2xh + h^2)(x + h) = x^3 + 3x^2h + 3xh^2 + h^3` }),
    () => ({ label: `If ${$m(`f(x) = ${T.poly([a, b, c])}`)}, then ${$m("f(x + h) =")}`, fn: (e) => a * (e.x + e.h) ** 2 + b * (e.x + e.h) + c, display: full, s: `${sumTex([[a, "(x + h)^2"], [b, "(x + h)"], [c, ""]])} = ${full}` }),
    () => { const d = sumTex([[2 * a, "xh"], [a, "h^2"], [b, "h"]]); return { label: `If ${$m(`f(x) = ${T.poly([a, b, c])}`)}, then ${$m("f(x + h) - f(x) =")}`, fn: (e) => a * (e.x + e.h) ** 2 + b * (e.x + e.h) - (a * e.x * e.x + b * e.x), display: d, s: `\\left[${full}\\right] - \\left(${T.poly([a, b, c])}\\right) = ${d}` }; },
    () => { const k = R.nz(-5, 5); return { label: $m(`(x ${k < 0 ? "-" : "+"} ${Math.abs(k)})^2 =`), fn: (e) => (e.x + k) ** 2, display: T.poly([1, 2 * k, k * k]), s: `x^2 + 2(${k})x + (${k})^2 = ${T.poly([1, 2 * k, k * k])}`, vars: ["x"] }; },

PGEN.algFactor = () => {
  const r = R.nz(-6, 6); let s; do { s = R.nz(-6, 6); } while (s === r);
  const blank = PP.num($m(`${T.poly([1, -(r + s), r * s])} = ${T.fac(r)}(x + \\square) \\quad \\square =`), q(-s));
  const pool = [
    () => { const k = R.int(2, 9); return { label: `Factor completely: ${$m(`x^2 - ${k * k}`)}`, fn: (e) => e.x * e.x - k * k, display: `(x - ${k})(x + ${k})`, s: `a^2 - b^2 = (a - b)(a + b) \\;\\Rightarrow\\; (x - ${k})(x + ${k})` }; },
    () => ({ label: `Factor completely: ${$m(T.poly([1, -(r + s), r * s]))}`, fn: (e) => (e.x - r) * (e.x - s), display: `${T.fac(r)}${T.fac(s)}`, s: `\\text{two numbers that multiply to } ${r * s} \\text{ and add to } ${-(r + s)}: ${-r}, ${-s} \\;\\Rightarrow\\; ${T.fac(r)}${T.fac(s)}` }),
    () => { const p = R.pick([2, 3]); let t; do { t = R.nz(-5, 5); } while (t % p === 0); const co = [p, t - p * r, -t * r]; return { label: `Factor completely: ${$m(T.poly(co))}`, fn: (e) => co[0] * e.x * e.x + co[1] * e.x + co[2], display: `${T.fac(r)}${T.lin(p, t)}`, s: `${T.fac(r)}${T.lin(p, t)} \\quad \\text{(expand to check: } ${T.poly(co)}\\text{)}` }; },
    () => { const aa = R.pick([1, 2, 3, -1]), bb = R.nz(-9, 9); return { label: `Factor completely: ${$m(T.poly([aa, bb, 0]))}`, fn: (e) => aa * e.x * e.x + bb * e.x, display: `x${T.lin(aa, bb)}`, s: `x \\text{ is in every term: } x${T.lin(aa, bb)}` }; },
  ];
  const items = R.sample(pool, 2).map((f) => f());
  return {
    prompt: para(`Factoring is how you cancel the 0/0 in a limit. Fill in the blank, then factor completely.`),
    parts: [blank, ...items.map((it) => PP.expr(it.label, it.fn, it.display, ["x"], { factored: true, forbid: [] }))],
    hint: "For x² + bx + c, find two numbers that multiply to c and add to b. For a² − b², use (a − b)(a + b).",
    solution: para(`<b>a.</b> ${$m(`${T.poly([1, -(r + s), r * s])} = ${T.fac(r)}${T.fac(s)}`)}, so the blank is ${$m(q(-s).tex())}.`) + items.map((it, i) => para(`<b>${"bc"[i]}.</b>`) + $M(it.s)).join(""),
  };
};

PGEN.algFractions = () => {
  const pool = [
    () => { const p = R.nz(-7, 7), a = R.int(2, 9), r = R.nz(-7, 7), b = R.int(2, 9), plus = R.chance(0.5), v = plus ? q(p, a).add(q(r, b)) : q(p, a).sub(q(r, b));
      return { kind: "num", label: $m(`\\frac{${p}}{${a}} ${plus ? "+" : "-"} \\frac{${r}}{${b}} =`), ans: v, s: `\\frac{${p * b} ${plus ? "+" : "-"} (${r * a})}{${a * b}} = ${v.tex()}` }; },
    () => { const g = R.int(2, 6), n = R.nz(-9, 9); let d; do { d = R.int(2, 9); } while (gcd(n, d) !== 1); return { kind: "num", label: $m(`\\frac{${n * g}}{${d * g}} =`), ans: q(n, d), s: `\\text{divide top and bottom by } ${g}: \\frac{${n}}{${d}}` }; },
    () => { const a = R.nz(-6, 6), b = R.int(2, 6), c = R.nz(-6, 6), d = R.int(2, 6); return { kind: "num", label: $m(`\\dfrac{\\frac{${a}}{${b}}}{\\frac{${c}}{${d}}} =`), ans: q(a * d, b * c), s: `\\frac{${a}}{${b}} \\cdot \\frac{${d}}{${c}} = ${q(a * d, b * c).tex()}` }; },
    () => ({ kind: "expr", label: `Combine into one fraction: ${$m("\\frac{1}{x + h} - \\frac{1}{x} =")}`, fn: (e) => -e.h / (e.x * (e.x + e.h)), display: "\\frac{-h}{x(x + h)}", vars: ["x", "h"], avoid: (e) => Math.abs(e.x) < 0.3 || Math.abs(e.x + e.h) < 0.3, s: `\\frac{x}{x(x + h)} - \\frac{x + h}{x(x + h)} = \\frac{x - (x + h)}{x(x + h)} = \\frac{-h}{x(x + h)}` }),
    () => { const a = R.nz(-6, 6), b = R.nz(-6, 6); return { kind: "expr", label: `Combine into one fraction: ${$m(`\\frac{${a}}{x} + \\frac{${b}}{x^2} =`)}`, fn: (e) => (a * e.x + b) / (e.x * e.x), display: `\\frac{${T.poly([a, b])}}{x^2}`, vars: ["x"], avoid: (e) => Math.abs(e.x) < 0.3, s: `\\frac{${a}x}{x^2} + \\frac{${b}}{x^2} = \\frac{${T.poly([a, b])}}{x^2}` }; },
  ];
  const items = R.sample(pool, 3).map((f) => f());
  return {
    prompt: para(`Simplify. Fractions must be fully reduced.`),
    parts: items.map((it) => (it.kind === "num" ? PP.num(it.label, it.ans) : PP.expr(it.label, it.fn, it.display, it.vars, { forbid: [], avoid: it.avoid }))),
    hint: "Get a common denominator before adding or subtracting. Dividing by a fraction means multiplying by its reciprocal.",
    solution: items.map((it, i) => para(`<b>${"abc"[i]}.</b>`) + $M(it.s)).join(""),
  };
};

PGEN.algRadicals = () => {
  const rewrites = [["\\sqrt{x}", q(1, 2)], ["\\frac{1}{x^3}", q(-3)], ["\\frac{1}{\\sqrt{x}}", q(-1, 2)], ["\\sqrt[3]{x^2}", q(2, 3)], ["\\frac{1}{x}", q(-1)], ["x\\sqrt{x}", q(3, 2)], ["\\frac{1}{x^2}", q(-2)], ["\\sqrt[4]{x^3}", q(3, 4)]];
  const powers = [[8, q(2, 3), q(4)], [27, q(1, 3), q(3)], [16, q(3, 4), q(8)], [4, q(-1, 2), q(1, 2)], [9, q(3, 2), q(27)], [3, q(-2), q(1, 9)], [2, q(-3), q(1, 8)], [25, q(1, 2), q(5)]];
  const [w1, w2] = R.sample(rewrites, 2), pw = R.pick(powers), r = R.int(2, 9);
  const items = [
    { part: PP.num($m(`${w1[0]} = x^{\\square} \\quad \\square =`), w1[1]), s: `${w1[0]} = x^{${w1[1].tex()}}` },
    { part: PP.num($m(`${w2[0]} = x^{\\square} \\quad \\square =`), w2[1]), s: `${w2[0]} = x^{${w2[1].tex()}}` },
    { part: PP.num($m(`${pw[0]}^{${pw[1].tex()}} =`), pw[2]), s: `${pw[0]}^{${pw[1].tex()}} = ${pw[2].tex()}` },
    { part: PP.expr($m(`(\\sqrt{x} - ${r})(\\sqrt{x} + ${r}) =`), (e) => e.x - r * r, `x - ${r * r}`, ["x"], { expanded: true, forbid: [], positive: true }), s: `(\\sqrt{x})^2 - ${r}^2 = x - ${r * r} \\quad \\text{(the conjugate trick in limits)}` },
  ];
  return {
    prompt: para(`Exponents and radicals. Fractional exponents are how you'll handle ${$m("\\sqrt{x}")} and ${$m("\\frac{1}{x}")} in derivatives.`),
    parts: items.map((it) => it.part),
    hint: "ⁿ√(xᵐ) = x^(m/n). 1/xⁿ = x^(−n). A negative exponent flips; the denominator of a fractional exponent is a root.",
    solution: items.map((it, i) => para(`<b>${"abcd"[i]}.</b> ${$m(it.s)}`)).join(""),
  };
};

PGEN.algLines = () => {
  let x1, x2; do { x1 = R.int(-5, 5); x2 = R.int(-5, 5); } while (x1 === x2);
  const y1 = R.int(-8, 8), y2 = R.int(-8, 8), slope = q(y2 - y1, x2 - x1);
  const m = R.pick([q(R.nz(-5, 5)), q(1, 2), q(-2, 3), q(3, 4), q(-3, 2)]), px = R.nz(-4, 4), py = R.int(-8, 8), b = q(py).sub(m.mul(px));
  const m2 = q(R.nz(-6, 6)), qx = R.nz(-5, 5), qy = R.int(-9, 9), b2 = q(qy).sub(m2.mul(qx));
  return {
    prompt: para(`Every tangent line ends with this algebra: slope, point-slope, then slope-intercept.`),
    parts: [
      PP.num(`Slope of the line through ${$m(`(${x1}, ${y1})`)} and ${$m(`(${x2}, ${y2})`)}`, slope),
      { ...PP.line(`Rewrite in slope-intercept form: ${$m(T.pointSlope(m, px, py))}`, m, b), slopeIntercept: true },
      { ...PP.line(`The line through ${$m(`(${qx}, ${qy})`)} with slope ${$m(m2.tex())}`, m2, b2), slopeIntercept: true },
    ],
    hint: "Slope = (y₂ − y₁)/(x₂ − x₁). Point-slope: y − y₁ = m(x − x₁). Distribute m, then add y₁ to both sides.",
    solution: $M(`m = \\frac{${y2} - (${y1})}{${x2} - (${x1})} = ${slope.tex()}`) +
      $M(`${T.pointSlope(m, px, py)} \\;\\Rightarrow\\; y = ${m.tex()}x ${m.mul(-px).n < 0 ? "-" : "+"} ${m.mul(px).abs().tex()} ${py < 0 ? "-" : "+"} ${Math.abs(py)} \\;\\Rightarrow\\; ${T.line(m, b)}`) +
      $M(`${T.pointSlope(m2, qx, qy)} \\;\\Rightarrow\\; ${T.line(m2, b2)}`),
  };
};

const state = Object.assign({ mode: "pearson", topic: "graphRead", progress: {}, mockScores: {}, ptopic: "limGraph", pprogress: {}, log: [], tests: [], guides: true, seenPearson: false, pearsonIntroSeen: false, plan: {}, examCfg: { minutes: 75, n: 20, calc: true } }, store.load());

function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if (html != null) e.innerHTML = html;
  return e;
}
function typeset(node) {
  const MJ = window.MathJax;
  if (MJ && MJ.typesetPromise) { if (MJ.typesetClear) MJ.typesetClear([node]); return MJ.typesetPromise([node]).catch(() => {}); }
  return Promise.resolve();
}
function makeProblem(id) {
  for (let i = 0; i < 6; i++) { try { return GEN[id](); } catch (e) { console.warn(id, e); } }
  throw new Error("Could not generate " + id);
}
function insertAt(input, text) {
  const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, s) + text + input.value.slice(e);
  const pos = s + text.length; input.setSelectionRange(pos, pos);
}

}

// ---------- problem card ----------
function partView(part, i, n) {
  const id = "p" + ++uidCounter;
  const li = el("li", { class: "part" });
  li.append(el("div", { class: "letter" }, n > 1 ? String.fromCharCode(97 + i) + "." : ""));
  const body = el("div", { class: "body" }); li.append(body);
  body.append(el("div", { class: "label", id: id + "-l" }, part.label));
  const feedback = el("div", { class: "feedback", "aria-live": "polite" });
  let api;
  if (part.type === "mc") {
    const tf = part.choices.length === 2 && part.choices[0] === "True";
    const wrap = el("div", { class: tf ? "choice-row" : "choices", role: "radiogroup", "aria-labelledby": id + "-l" });
    const inputs = part.choices.map((c, j) => {
      const lab = el("label", { class: "choice" });
      const inp = el("input", { type: "radio", name: id, id: `${id}-${j}`, value: String(j) });
      inp.addEventListener("change", () => { li.classList.remove("ok", "bad"); inputs.forEach((o) => o.lab.classList.remove("wrong")); });
      lab.append(inp, el("span", {}, c)); wrap.append(lab);
      return { inp, lab };
    });
    body.append(wrap, feedback);
    api = {
      value: () => inputs.findIndex((o) => o.inp.checked),
      grade() { const k = this.value(); return k < 0 ? { empty: true } : { ok: k === part.ans }; },
      mark(res, reveal) { const k = this.value(); inputs.forEach((o, j) => { o.lab.classList.toggle("right", !!reveal && j === part.ans); o.lab.classList.toggle("wrong", !!res && res.ok === false && j === k); }); },
      lock() { inputs.forEach((o) => { o.inp.disabled = true; }); },
      answerText: () => part.choices[part.ans],
    };
  } else {
    const row = el("div", { class: "answer-row" });
    const input = el("input", {
      type: "text", id, autocomplete: "off", autocapitalize: "off", spellcheck: "false", inputmode: "text", "aria-labelledby": id + "-l",
      placeholder: part.type === "line" ? "y = …" : part.type === "expr" ? `in terms of ${(part.vars || ["x"]).join(" and ")}` : "number, inf, -inf, or DNE",
    });
    const mark = el("span", { class: "mark", hidden: "" });
    row.append(input, mark);
    const keys = el("div", { class: "keys", "aria-label": "insert symbols" });
    const keyset = part.type === "num" ? ["DNE", "inf", "-inf", "/", "sqrt(", "^"]
      : part.type === "expr" ? ["^", "/", "(", ")", "sqrt(", ...(part.vars || ["x"])]
        : ["y = ", "x", "^", "/", "(", ")"];
    keyset.forEach((k) => keys.append(el("button", { type: "button", tabindex: "-1", onclick: () => { insertAt(input, k); input.dispatchEvent(new Event("input")); input.focus(); } },
      k === "inf" ? "∞" : k === "-inf" ? "−∞" : k === "sqrt(" ? "√(" : k.trim())));
    const preview = el("div", { class: "preview" });
    body.append(row, keys, preview, feedback);
    let timer;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => updatePreview(input.value, part.type, preview), 220);
      li.classList.remove("ok", "bad"); mark.hidden = true; feedback.innerHTML = "";
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); input.closest(".sheet")?.querySelector("[data-check]")?.click(); } });
    api = {
      value: () => input.value,
      grade: () => Check[part.type](input.value, part),
      mark(res) {
        if (!res || res.empty || !("ok" in res)) { mark.hidden = true; return; }
        mark.hidden = false; mark.className = "mark " + (res.ok ? "ok" : "bad"); mark.textContent = res.ok ? "✓ correct" : "✗ not yet";
      },
      lock() { input.disabled = true; keys.remove(); },
      answerText: () => $m(part.type === "num" ? T.ans(part.ans) : part.display),
    };
  }
  Object.assign(api, { li, feedback, part });
  return { li, api };
}
function updatePreview(raw, type, box) {
  if (!raw.trim()) { box.innerHTML = ""; return; }
  const tex = Check.preview(raw, type);
  box.innerHTML = tex == null ? `<span class="pv-lbl">reads as</span>…keep typing` : `<span class="pv-lbl">reads as</span>\\(${tex}\\)`;
  if (tex != null) typeset(box);
}
function applyResult(api, res, reveal) {
  api.li.classList.remove("ok", "bad");
  let fb = "";
  if (res.empty) fb = reveal ? "" : `<span class="reveal">No answer yet.</span>`;
  else if (res.err && !("ok" in res)) fb = `<span class="preview err">${res.err}</span>`;
  else {
    api.li.classList.add(res.ok ? "ok" : "bad");
    if (res.err) fb += `<span class="preview err">${res.err}</span>`;
    if (res.note) fb += `<div>${res.note}</div>`;
  }
  if (reveal && !res.ok) fb += `<div class="reveal">Answer: ${api.answerText()}</div>`;
  api.feedback.innerHTML = fb;
  api.mark(res, reveal);
}
function problemCard(pr, { title, tag, num }) {
  const card = el("article", { class: "sheet" });
  card.append(el("div", { class: "sheet-head" }, `<h3>${num ? `<span class="qnum">${num}.</span>` : ""}${title}</h3><span class="tag">${tag}</span>`));
  card.append(el("div", { class: "prompt" }, pr.prompt));
  if (pr.figure) { card.append(el("div", { class: "figure" }, pr.figure)); if (pr.figure.includes("gp-guide")) card.append(guideToggle()); }
  const list = el("ol", { class: "parts" });
  const ctrls = pr.parts.map((part, i) => { const { li, api } = partView(part, i, pr.parts.length); list.append(li); return api; });
  card.append(list);
  return { card, ctrls };
}

// ---------- practice & mixed ----------
const answerOf = (c) => (c.part.type === "mc" ? (c.value() >= 0 ? c.part.choices[c.value()] : "") : c.value());
function tipsCard() {
  const d = el("details", { class: "sheet" });

  d.innerHTML = `<summary class="sheet-head" style="cursor:pointer;margin-bottom:0;border:0;padding:0"><h3>How to type answers</h3><span class="tag">open / close</span></summary>

      <div class="cell"><h4>Tangent lines</h4><p><code>y = -8x - 9</code> or point-slope <code>y - 15 = -8(x + 3)</code>. Both count.</p></div>

    <p class="warn"><b>From your HW 2, #3:</b> ${$m("6 - x - x^2")} at ${$m("x = 1")} is ${$m("6 - 1 - 1 = 4")}, not ${$m("-4")}. The sign got lost when the expression was rewritten as ${$m("x^2 + x - 6")}. Substitute into the original piece, term by term. The continuity drills use negative leading terms on purpose.</p>`;
  return d;
}
function renderPractice(mixed) {
  const main = document.getElementById("main"); main.innerHTML = "";
  if (!mixed) main.append(tipsCard());
  const id = mixed ? R.pick(Object.keys(TOPIC_BY_ID)) : state.topic;
  const t = TOPIC_BY_ID[id], pr = freshProblem(makeProblem, id);
  const { card, ctrls } = problemCard(pr, { title: t.name, tag: `§${t.sec}${mixed ? " · mixed review" : ""}` });
  const btnCheck = el("button", { class: "btn primary", type: "button", "data-check": "" }, "Check answers");
  const btnHint = el("button", { class: "btn ghost", type: "button" }, "Hint");
  const btnSol = el("button", { class: "btn", type: "button" }, "Show solution");
  const btnNext = el("button", { class: "btn", type: "button" }, mixed ? "Next random problem →" : "New problem →");
  const score = el("span", { class: "score-line", "aria-live": "polite" });
  const actions = el("div", { class: "actions" }); actions.append(btnCheck, btnHint, btnSol, btnNext, score);
  const hintBox = el("div", { class: "hint", hidden: "" }, `<b>Hint</b>${pr.hint}`);
  const solBox = el("div", { class: "solution", hidden: "" }, `<div class="sol-lbl">Worked solution</div>${pr.solution}`);
  card.append(actions, hintBox, solBox);
  let tried = false;
  btnCheck.onclick = () => {
    const results = ctrls.map((c) => { const r = c.grade(); applyResult(c, r, !solBox.hidden); return r; });
    const right = results.filter((r) => r.ok).length, total = results.length;
    if (!tried && results.some((r) => !r.empty)) {
      tried = true;
      recordResult({ catalog: "gen", id, mode: mixed ? "mixed" : "practice", pr, results, helped: !solBox.hidden, attempts: 1, answers: ctrls.map(answerOf) });
    }
    score.textContent = right === total ? `All ${total} correct${solBox.hidden ? "" : " (solution was open)"}` : `${right} of ${total} correct`;
    persist(); renderRail(); typeset(card);
  };
  btnHint.onclick = () => { hintBox.hidden = !hintBox.hidden; };
  btnSol.onclick = () => { if (!tried) { tried = true; recordResult({ catalog: "gen", id, mode: mixed ? "mixed" : "practice", pr, results: ctrls.map((c) => c.grade()), helped: true, attempts: 1, answers: ctrls.map(answerOf) }); renderRail(); } solBox.hidden = false; ctrls.forEach((c) => applyResult(c, c.grade(), true)); typeset(card); solBox.scrollIntoView({ behavior: smooth(), block: "start" }); };
  btnNext.onclick = () => { renderPractice(mixed); window.scrollTo({ top: 0, behavior: smooth() }); };
  main.append(card);
  typeset(main);
}
